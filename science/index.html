<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>과학 킹덤</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--o:#4a3b5c;--c:80px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--o);user-select:none;-webkit-user-select:none;background:#8fd067}
.j,.btn,.pill,h1,h2,h3{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
button{font-family:inherit;color:var(--o)}
.wave{position:fixed;font-size:22px;color:#ffffff88;pointer-events:none;animation:wv 6s ease-in-out infinite;font-family:Jua}
@keyframes wv{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
/* top */
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;z-index:35;pointer-events:none}
#top>*{pointer-events:auto}
.kname{background:#fff;border:3px solid var(--o);border-radius:16px;padding:4px 12px;box-shadow:0 4px 0 var(--o);line-height:1.15;cursor:pointer}
.kname b{font-family:Jua;font-size:19px;font-weight:400}.kname small{display:block;font-size:12px;color:#8a7a9a}
.pill{background:#fff;border:3px solid var(--o);border-radius:99px;padding:3px 10px 3px 6px;font-size:18px;box-shadow:0 3px 0 var(--o);display:flex;align-items:center;gap:3px;line-height:1.1}
.pill small{font-size:11px;color:#8a7a9a;font-family:'Gowun Dodum';margin-left:2px}
.pill.flash{animation:fsh .5s}
@keyframes fsh{40%{transform:scale(1.15);background:#fff6b0}}
.sp{flex:1}
.ibtn{width:42px;height:42px;border:3px solid var(--o);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--o);font-size:20px;cursor:pointer}
/* quest */
#quest{position:fixed;left:8px;top:72px;z-index:19;background:#fffaf0;border:3px solid var(--o);border-radius:16px;box-shadow:0 4px 0 var(--o);padding:8px 12px;max-width:230px;font-size:14px}
#quest h3{font-size:15px;margin-bottom:2px}
#quest .qb{margin-top:6px;font-family:Jua;font-size:15px;border:2.5px solid var(--o);border-radius:12px;background:#ffcf3f;padding:4px 10px;cursor:pointer;animation:bnc 1s infinite;box-shadow:0 3px 0 var(--o)}
#quest.min{max-width:44px;padding:4px 8px;cursor:pointer}#quest.min>*:not(h3){display:none}
@keyframes bnc{50%{transform:translateY(-3px)}}
#crisis{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:19;background:#ffe0e0;border:3px solid #c0392b;border-radius:16px;box-shadow:0 4px 0 #c0392b;padding:6px 14px;font-family:Jua;font-size:16px;color:#8b1e1e;display:none;text-align:center;animation:shk 2s infinite}
@keyframes shk{0%,90%,100%{transform:translateX(-50%)}93%{transform:translateX(calc(-50% - 4px))}96%{transform:translateX(calc(-50% + 4px))}}
/* map */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-top:40px}
#island{position:relative;padding:calc(var(--c)*.32);background:radial-gradient(ellipse at 50% 45%,#c3ec9a,#a6e07c 70%,#98d870);border-radius:calc(var(--c)*.5);box-shadow:0 0 0 calc(var(--c)*.09) #e0b47a,0 0 0 calc(var(--c)*.09 + 3px) #8a5a33,0 calc(var(--c)*.1) 0 calc(var(--c)*.09 + 3px) #6b4428,0 14px 30px #2a4a1a44}

#land{position:fixed;inset:0;z-index:0;pointer-events:none}#land svg{width:100%;height:100%;display:block}
.flowd{animation:fw 1.2s linear infinite}
@keyframes fallA{to{background-position:0 16px}}
.cl{position:fixed;width:120px;height:38px;background:#fff;border-radius:40px;opacity:.85;animation:cmove linear infinite;pointer-events:none;z-index:0}
.cl::before{content:'';position:absolute;width:56px;height:56px;background:#fff;border-radius:50%;left:18px;top:-26px}
.cl::after{content:'';position:absolute;width:40px;height:40px;background:#fff;border-radius:50%;left:60px;top:-16px}
@keyframes cmove{from{transform:translateX(-30vw) scale(var(--s))}to{transform:translateX(130vw) scale(var(--s))}}
.mini{position:fixed;width:90px;pointer-events:none;z-index:1;animation:bo 4s ease-in-out infinite;opacity:.95}.mini svg{width:100%;overflow:visible}
#world{position:fixed;inset:0;z-index:30;display:none;background:#5bb8e8 radial-gradient(ellipse at 50% 50%,#7fd0f3,#4aa6dc)}
#world .wh{position:absolute;top:62px;left:0;right:0;text-align:center;font:24px Jua;z-index:3;text-shadow:0 2px 0 #fff}
#wmap{position:absolute;left:50%;top:96px;transform:translateX(-50%);width:min(96vw,calc((100vh - 190px)*1.4286));aspect-ratio:10/7}#wmap>svg,#wmap>canvas{position:absolute;inset:0;width:100%;height:100%}
.isle{position:absolute;width:clamp(50px,7.5vw,96px);margin-left:calc(clamp(50px,7.5vw,96px)/-2);margin-top:calc(clamp(50px,7.5vw,96px)*-.72);cursor:pointer;text-align:center;z-index:2;transition:transform .15s}
.isle svg{width:100%;overflow:visible;display:block}
.isle .ln{font:clamp(11px,1.3vw,15px) Jua;background:#fff;border:2.5px solid var(--o);border-radius:99px;padding:0 8px;white-space:nowrap;display:inline-block;margin-top:-10px;position:relative}
.isle.me .ln{background:#ffcf3f}.isle.war .ln{box-shadow:0 0 0 3px #ff5a5a}
.isle:hover{transform:scale(1.1);z-index:4}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0}.vs b{font-family:Jua;font-weight:400}.vs .bar{margin:3px 0}
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0}.dots span{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--o);background:#fff}.dots .o{background:#5fd068}.dots .x{background:#ff7b7b}
.ncard{border:3px solid var(--o);border-radius:18px;padding:8px 12px;box-shadow:0 3px 0 var(--o)}.ncard.fallen{opacity:.55;background:#eee}
.nh{display:flex;gap:10px;align-items:center}.nic{font-size:34px}.nh b{font:19px Jua;font-weight:400}
.tag{font:13px Jua;border:2px solid var(--o);border-radius:99px;padding:0 7px;background:#fff}.tag.war{background:#ffb3b3}.tag.ally{background:#ffc9da}.tag.trade{background:#bde3ff}
.relbar{position:relative;height:12px;border:2.5px solid var(--o);border-radius:99px;background:#fff;overflow:hidden;margin-top:6px}.relbar .rf{height:100%}.relbar i{position:absolute;top:0;bottom:0;width:2px;background:var(--o);left:50%!important}
#grid{display:grid;grid-template-columns:repeat(7,var(--c));grid-template-rows:repeat(5,var(--c));gap:calc(var(--c)*.07)}
.plot{position:relative;border-radius:24%;cursor:pointer;transition:transform .15s}
.plot svg{width:100%;height:100%;overflow:visible;display:block}
.plot.empty{background:#9ce277;border:3px dashed #5fae3f}
.plot.empty::after{content:'+';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:calc(var(--c)*.42) Jua;color:#4f9a33;opacity:.6}
.plot.empty:hover{transform:scale(1.06);background:#b5ee93}.plot.empty:hover::after{opacity:1}
.plot.locked{cursor:default}
.plot.b:hover{transform:translateY(-4px) scale(1.04)}
.plot.castle svg{transform:scale(1.3);transform-origin:50% 92%}
.plot.new{animation:popin .5s}
@keyframes popin{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.badge{position:absolute;right:-4px;top:-6px;background:#ffd84d;border:2.5px solid var(--o);border-radius:99px;font:calc(var(--c)*.17) Jua;padding:0 5px;z-index:2;line-height:1.3}
.plot.halt svg{filter:grayscale(1) brightness(.85)}
.plot.halt::before{content:attr(data-h);position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-size:calc(var(--c)*.3);z-index:3;animation:bnc .8s infinite}
.float{position:fixed;pointer-events:none;font:17px Jua;z-index:40;animation:fl 1.5s forwards;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap}
@keyframes fl{0%{opacity:0;transform:translate(-50%,0)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px)}}
.vil{position:absolute;width:calc(var(--c)*.36);height:calc(var(--c)*.42);transition:left 4s linear,top 4s linear;z-index:5;cursor:pointer;margin:calc(var(--c)*-.21) 0 0 calc(var(--c)*-.18)}
.vil svg{width:100%;height:100%;animation:hop .5s infinite alternate}
.vil.flip svg{transform:scaleX(-1)}
@keyframes hop{to{translate:0 -3px}}
#bubble{position:fixed;z-index:45;background:#fff;border:3px solid var(--o);border-radius:16px;padding:8px 12px;max-width:240px;font-size:14px;box-shadow:0 4px 0 var(--o);display:none;pointer-events:none}
#bubble b{font-family:Jua;font-weight:400;color:#7b5cd6}
/* svg anim */
.spin{animation:rot 3s linear infinite}.spin2{animation:rot 1.6s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.puff{animation:puf 2.4s ease-out infinite}
@keyframes puf{0%{transform:translateY(6px) scale(.5);opacity:0}30%{opacity:1}100%{transform:translateY(-14px) scale(1.2);opacity:0}}
.pulse{animation:pls 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pls{50%{transform:scale(1.15);fill:#c6fdff}}
.beam{animation:bm 1.2s ease-in-out infinite}@keyframes bm{50%{opacity:.15}}
.bub{animation:bb 1.8s ease-in infinite}.bub.b2{animation-delay:.9s}
@keyframes bb{0%{transform:translateY(8px);opacity:0}40%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
.bob{animation:bo 1.6s ease-in-out infinite}@keyframes bo{50%{transform:translateY(-4px)}}
.twinkle{animation:tw 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{50%{transform:scale(.5);opacity:.4}}
.flag{animation:fg 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}@keyframes fg{to{transform:scaleX(.75) skewY(6deg)}}
.flow{animation:fw .8s linear infinite}@keyframes fw{to{stroke-dashoffset:-12}}
.drift{animation:dr 4s ease-in-out infinite}@keyframes dr{50%{transform:translateX(5px)}}
.sway{animation:swy 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}@keyframes swy{50%{transform:rotate(3deg)}}
/* bottom */
#bot{position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:35;pointer-events:none;flex-wrap:wrap;padding:0 6px}
#bot>*{pointer-events:auto}
.btn{font-size:19px;border:3px solid var(--o);border-radius:18px;padding:9px 16px;background:#fff;box-shadow:0 5px 0 var(--o);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--o)}
.btn.main{background:#ffcf3f;font-size:23px;padding:11px 26px}
.btn.green{background:#8ee07a}.btn.pink{background:#ffb3c6}.btn.blue{background:#9ad7ff}.btn.purple{background:#d4c2ff}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--o)}
.btn.sm{font-size:15px;padding:6px 12px;border-radius:14px;box-shadow:0 3px 0 var(--o)}
/* modal */
#mw{position:fixed;inset:0;background:#2a1f3a88;display:none;align-items:center;justify-content:center;z-index:50;padding:10px}
#mbox{background:#fffaf0;border:4px solid var(--o);border-radius:26px;box-shadow:0 8px 0 var(--o);max-width:600px;width:100%;max-height:94vh;overflow:auto;padding:18px 20px;animation:pop .25s;position:relative}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
#mbox h2{font-size:26px;margin-bottom:6px}
.x{position:absolute;right:12px;top:10px;width:36px;height:36px;border:3px solid var(--o);border-radius:12px;background:#fff;font:20px Jua;cursor:pointer}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:16px Jua;border:2.5px solid var(--o);border-radius:99px;padding:4px 11px;background:#fff;cursor:pointer}
.chip.on{background:var(--cc,#ffcf3f);box-shadow:0 3px 0 var(--o)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 40px 10px 0}
.streak{font:18px Jua;color:#e8590c}
.qcard{background:#fff;border:3px solid var(--o);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.qtag{display:inline-block;font:14px Jua;border:2px solid var(--o);border-radius:99px;padding:1px 10px;margin-bottom:8px}
.qtext{font-size:21px;font-weight:700;line-height:1.45;word-break:keep-all}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font-size:18px;font-weight:700;border:3px solid var(--o);border-radius:16px;padding:10px 12px;background:#fff;margin-bottom:8px;cursor:pointer;box-shadow:0 3px 0 var(--o);word-break:keep-all;line-height:1.35}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:#ffe9a8;border:2.5px solid var(--o);display:flex;align-items:center;justify-content:center;font:16px Jua}
.opt:hover:not(:disabled){background:#fff6d8}
.opt.ok{background:#bdf3ad}.opt.ok b{background:#5fd068}
.opt.no{background:#ffc2c2}.opt.no b{background:#ff7b7b}
.opt:disabled{cursor:default}
.res{border-radius:18px;padding:12px 14px;border:3px solid var(--o);font-size:16px;line-height:1.5;animation:pop .25s}
.res.ok{background:#e9ffe2}.res.no{background:#fff0f0}
.res h3{font-size:22px}
.rw{display:inline-block;font:17px Jua;background:#fff;border:2px solid var(--o);border-radius:99px;padding:1px 9px;margin:4px 4px 0 0}
.stamp{float:right;font:20px Jua;color:#e03131;border:3px solid #e03131;border-radius:50%;width:86px;height:86px;display:flex;font-size:17px;word-break:keep-all;align-items:center;justify-content:center;text-align:center;line-height:1.05;transform:rotate(-14deg);animation:stp .35s}
@keyframes stp{0%{transform:scale(2.2) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-14deg);opacity:1}}
.blist{display:grid;gap:8px}
.bitem{display:flex;gap:10px;align-items:center;border:3px solid var(--o);border-radius:18px;background:#fff;padding:6px 10px;cursor:pointer;box-shadow:0 3px 0 var(--o)}
.bitem:hover{background:#fff6d8}.bitem.dis{opacity:.5;cursor:not-allowed}.bitem.lock{opacity:.4;cursor:not-allowed;filter:grayscale(.7)}
.bitem .art{width:58px;height:58px;flex:none}.bitem .art svg{width:100%;height:100%;overflow:visible}
.bitem .inf{flex:1;font-size:13px;line-height:1.35}.bitem .inf b{font:18px Jua;font-weight:400}
.cost{display:inline-block;font:14px Jua;padding:0 6px;border-radius:99px;background:#f3eefc;margin:2px 2px 0 0}.cost.bad{background:#ffd6d6;color:#c0392b}
.big{width:150px;height:150px;margin:0 auto}.big svg{width:100%;height:100%;overflow:visible}
.req{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.bar{height:16px;border:2.5px solid var(--o);border-radius:99px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%}
.frow{display:grid;grid-template-columns:70px 1fr 90px;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.wl{font-size:14px;border-top:2px dashed #cbbfe0;padding:6px 0}
.wl .a{color:#2b8a3e;font-weight:700}.wl .m{color:#c0392b}
/* title */
#title{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:12px;background:#6cc9ef radial-gradient(ellipse at 50% 40%,#bdf0ff,#6cc9ef 60%,#3fa8d8)}
.tcard{background:#fffaf0;border:4px solid var(--o);border-radius:30px;box-shadow:0 10px 0 var(--o);padding:18px 22px;max-width:520px;width:100%;text-align:center;max-height:96vh;overflow:auto}
.logo{font:54px Jua;color:#ffcf3f;-webkit-text-stroke:3px var(--o);paint-order:stroke;text-shadow:0 5px 0 var(--o);letter-spacing:2px;line-height:1.1}
.logo span{color:#ff8fab}
.tcard input{font:20px Jua;border:3px solid var(--o);border-radius:14px;padding:8px 12px;width:100%;text-align:center;margin:6px 0;background:#fff;color:var(--o)}
.lvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:6px 0}
.lvb{font:16px Jua;border:3px solid var(--o);border-radius:14px;padding:8px 4px;background:#fff;cursor:pointer}
.lvb.on{background:#ffcf3f;box-shadow:0 3px 0 var(--o)}
.lvb small{display:block;font:11px 'Gowun Dodum';color:#8a7a9a}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:70;background:var(--o);color:#fff;border-radius:16px;padding:8px 16px;font:16px Jua;display:none;max-width:90vw;text-align:center}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:80;pointer-events:none;animation:cf 2.4s linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.gcard{display:flex;gap:8px;align-items:center;border:3px solid var(--o);border-radius:16px;background:#fff;padding:5px 8px;cursor:pointer;box-shadow:0 3px 0 var(--o)}.gcard.on{background:#fff3c4;box-shadow:0 0 0 3px #ffcf3f,0 3px 0 var(--o)}
.gcard .gp{width:46px;flex:none}.gcard svg{width:100%;display:block}.gcard .gi{font-size:12px;line-height:1.35}.gcard b{font:17px Jua;font-weight:400}.gcard .st{color:#6b5b7b}.gcard .sk{color:#7b5cd6}
.bhead{display:flex;justify-content:space-between;gap:8px;margin:4px 0}.bg{display:flex;gap:6px;align-items:center}.bg svg{width:40px}.bg b{font:17px Jua;font-weight:400;display:block}.bg small{font-size:11px;color:#7b5cd6}
.hp{display:grid;grid-template-columns:1fr auto auto auto 1fr;gap:6px;align-items:center;font:15px Jua}.hp>div{height:14px;border:2.5px solid var(--o);border-radius:99px;background:#fff;overflow:hidden;display:flex}.hp i{display:block;height:100%;background:#7ec8ff;transition:width .5s}.vsx{color:#c0392b}
.field{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#cdeeb0,#a6dc80);border:3px solid var(--o);border-radius:16px;padding:8px;margin:6px 0;min-height:86px;overflow:hidden}
.side{display:flex;flex-wrap:wrap;gap:3px;width:44%;align-content:center;transition:transform .25s}.side.en{flex-direction:row-reverse}
.tok{width:26px;height:26px;border-radius:50%;border:2px solid var(--o);display:flex;align-items:center;justify-content:center;font-size:14px;background:#bde3ff;transition:opacity .4s}.side.en .tok{background:#ffc9c9}.tok.dead{opacity:.15;filter:grayscale(1)}
.lunge-me{transform:translateX(34px)}.lunge-en{transform:translateX(-34px)}.side.hit .tok:not(.dead){animation:hitf .45s}@keyframes hitf{50%{transform:scale(.75);background:#ff5a5a}}
.blog{font-size:13px;background:#fff6d8;border-radius:10px;padding:4px 8px;margin-bottom:6px}
.isle.atk .ln{box-shadow:0 0 0 3px #ff8f3f;animation:bnc 1s infinite}
.gcap{margin-top:10px;background:#fff3c4;border-radius:14px;padding:8px}
.chip.sm{font-size:13px;padding:2px 9px}.uch{margin:-4px 0 8px}.clsbar{background:#e6f7ff;border:2px solid var(--o);border-radius:12px;padding:3px 10px;font-size:14px;margin-bottom:8px}
.gp{position:relative}.glv{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font:11px Jua;background:#ffd84d;border:2px solid var(--o);border-radius:99px;padding:0 4px;white-space:nowrap}
.eqsel{width:100%;margin-top:4px;font:13px 'Gowun Dodum';border:2px solid var(--o);border-radius:10px;padding:3px;background:#fff;color:var(--o)}

let S=null,started=false;

function save(){if(!S||WIPED)return;S.last=Date.now();try{localStorage.setItem('sk-save',JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('sk-save'));return s&&s.v?migrate(s):null}catch(e){return null}}
const fmt=n=>{n=Math.floor(n);return n>=10000?(n/1000).toFixed(n>=100000?0:1)+'k':String(n)};
const bcount=t=>allPlots().filter(p=>p.t===t).length;
const sumLv=t=>allPlots().filter(p=>p.t===t).reduce((a,p)=>a+p.lv,0);
const scale=(c,m)=>{const r={};for(const k in c)r[k]=Math.ceil(c[k]*m);return r};
const buildCost=t=>scale(BD[t].cost,Math.pow(1.35,bcount(t)));
const upCost=p=>scale(BD[p.t].cost,Math.pow(1.7,p.lv));
const castleCost=()=>{const m=Math.pow(1.75,S.k-1);return{gold:Math.ceil(80*m),energy:Math.ceil(40*m),element:Math.ceil(40*m),life:Math.ceil(40*m),mineral:Math.ceil(40*m)}};
const canPay=c=>Object.keys(c).every(k=>S.res[k]>=c[k]);
const pay=c=>{for(const k in c)S.res[k]-=c[k]};
const costHtml=c=>Object.keys(c).map(k=>`<span class="cost ${S.res[k]<c[k]?'bad':''}">${RES[k].ic}${fmt(c[k])}</span>`).join('');
const halted=t=>BD[t].f&&S.crisis&&S.crisis.f===BD[t].f;

/* ---------- ui helpers ---------- */

function closeM(){if(mOpen==='battle'||mOpen==='atkalert'||mOpen==='exam')return;$('#mw').style.display='none';mOpen=null;Q=null;checkPending()}
function floatAt(el,txt,color){const r=el.getBoundingClientRect();const f=document.createElement('div');f.className='float';f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top+r.height*.2)+'px';f.style.color=color||O;f.textContent=txt;document.body.appendChild(f);setTimeout(()=>f.remove(),1500)}
function confetti(){const cs=['#ffcf3f','#ff8fab','#7ec8ff','#8ee07a','#b388ff'];for(let i=0;i<60;i++){const c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=rnd(cs);c.style.animationDelay=Math.random()*.6+'s';c.style.animationDuration=(1.8+Math.random()*1.4)+'s';c.style.borderRadius=Math.random()<.5?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),3800)}}
function fit(){const top=$('#top').getBoundingClientRect().bottom||60;const w=innerWidth-36,h=innerHeight-top-110;const c=Math.max(36,Math.floor(Math.min(w/(COLS+(innerWidth<640?.9:1.3)),h/(ROWS+1.6),128)));document.documentElement.style.setProperty('--c',c+'px');$('#stage').style.paddingTop=(top-20)+'px'}
addEventListener('resize',fit);

function renderMap(newI){if(VIEW!=null&&S.terr[VIEW]!=='me'){VIEW=null;toast('😢 그 도시를 잃어서 수도로 돌아왔어요')}const un=new Set(ORDER.slice(0,viewUnl()));let h='';
 for(let i=0;i<COLS*ROWS;i++){
  if(i===CASTLE){h+=VIEW==null?`<div class="plot b castle" data-i="${i}" title="과학의 성">${artOf('castle',S.k)}<div class="badge">Lv${S.k}</div></div>`:`<div class="plot b castle" data-i="${i}" title="관청">${isleSvg(WORLD[VIEW])}<div class="badge">관청</div></div>`;continue}
  const p=curP()[i];
  if(p){const hl=halted(p.t);h+=`<div class="plot b ${hl?'halt':''} ${newI===i?'new':''}" data-i="${i}" ${hl?`data-h="${CRISIS[S.crisis.f].ic}"`:''} title="${BD[p.t].n} Lv${p.lv}">${artOf(p.t)}<div class="badge">${'★'.repeat(p.lv)}</div></div>`}
  else if(un.has(i))h+=`<div class="plot empty" data-i="${i}" title="빈 땅 — 눌러서 건설"></div>`;
  else h+=`<div class="plot locked" data-i="${i}" title="성 레벨을 올리면 개척할 수 있어요">${svg(tree(i))}</div>`}
 $('#grid').innerHTML=h;placeVillagers();cityBar();markMove()}
$('#grid').addEventListener('click',e=>{if(DRAG.done){DRAG.done=false;return}const el=e.target.closest('.plot');if(!el)return;const i=+el.dataset.i;snd('click');if(MOVE!=null)return moveTo(i);
 if(i===CASTLE)return VIEW==null?castlePanel():cityPanel();if(curP()[i])return bPanel(i);if(el.classList.contains('empty'))return buildMenu(i);toast('🌳 성을 업그레이드하면 이 땅을 개척할 수 있어요!')});

let vils=[];
function placeVillagers(){const isl=$('#island');const n=Math.min(14,2+Math.floor(pop()/4));
 while(vils.length>n)vils.pop().el.remove();
 vils=vils.filter(v=>isl.contains(v.el));
 while(vils.length<n){const el=document.createElement('div');el.className='vil';el.innerHTML=villSvg(VCOL[vils.length%VCOL.length]);const v={el,x:20+Math.random()*60,y:20+Math.random()*60,nm:VNAME[vils.length%VNAME.length],job:rnd(VJOB)};el.style.left=v.x+'%';el.style.top=v.y+'%';
  el.onclick=e=>{e.stopPropagation();snd('click');showBubble(e.clientX,e.clientY,v)};isl.appendChild(el);vils.push(v)}}
function moveVillagers(){for(const v of vils){if(Math.random()<.45){const nx=6+Math.random()*88,ny=6+Math.random()*88;v.el.classList.toggle('flip',nx<v.x);v.x=nx;v.y=ny;v.el.style.left=nx+'%';v.el.style.top=ny+'%'}}}
function showBubble(x,y,v){const b=$('#bubble');b.innerHTML=`<b>🧑‍🔬 ${v?v.nm+' ('+v.job+')':'과학 주민'}:</b> ${rnd(FACTS)}`;b.style.display='block';const w=b.offsetWidth;b.style.left=Math.max(6,Math.min(innerWidth-w-6,x-w/2))+'px';b.style.top=Math.max(6,y-b.offsetHeight-24)+'px';clearTimeout(showBubble.h);showBubble.h=setTimeout(()=>b.style.display='none',4200)}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.vil'))$('#bubble').style.display='none'});

function doBuild(i,t){const c=buildCost(t);if(!canPay(c)){snd('no');return toast('자원이 부족해요! 🔬 연구하기로 모아 보세요')}
 pay(c);curP()[i]={t,lv:1};snd('build');closeM();renderMap(i);renderTop();toast(`🎉 ${jo(BD[t].n,'을','를')} 지었어요!`.replace('을(를)',josa(BD[t].n)));checkQuest();save()}
function josa(w){const c=w.charCodeAt(w.length-1);return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?'을':'를'}
function bPanel(i){if(examGuard())return;const p=curP()[i],d=BD[p.t];const max=p.lv>=5,capped=p.lv>=S.k+1;const c=upCost(p);
 const pr=Object.keys(d.prod).map(k=>`${RES[k].ic} ${d.prod[k]*p.lv}/분 → <b>${d.prod[k]*(p.lv+1)}/분</b>`).join('<br>');
 openM(`<h2>${d.n} <span style="font-size:18px">${'★'.repeat(p.lv)}${'☆'.repeat(5-p.lv)}</span></h2><div class="big">${artOf(p.t)}</div><p style="text-align:center;margin:6px 0">${d.d}</p>
 ${halted(p.t)?`<p style="text-align:center;color:#c0392b;font-family:Jua">${CRISIS[d.f].ic} ${CRISIS[d.f].n} 때문에 멈췄어요! ${FIELDS[d.f].n} 문제를 맞혀 복구해요.</p>`:''}
 ${max?`<p style="text-align:center;font-family:Jua;font-size:18px">🏆 최고 레벨이에요!</p>`:`<div style="text-align:center;font-size:15px">${pr}${d.fx?`<div style="color:#7b5cd6">✨ ${d.fx}</div>`:''}</div><div class="req">${costHtml(c)}</div>${capped?`<p style="text-align:center;font-size:14px;color:#c0392b">성 레벨을 먼저 올려야 더 강화할 수 있어요 (성 Lv${p.lv})</p>`:''}`}
 <div class="row">${max?'':`<button class="btn green" ${capped||!canPay(c)?'disabled':''} onclick="doUp(${i})">⬆️ 업그레이드</button>`}${p.t==='market'?`<button class="btn main" onclick="openMarket()">🏪 거래하기</button>`:''}<button class="btn blue" onclick="startMove(${i})">🔀 옮기기</button><button class="btn sm" id="dem" onclick="demolish(${i},this)">🧹 철거</button></div><p style="text-align:center;font-size:12px;color:#8a7a9a">💡 건물을 꾹 눌러 끌어다 놓아도 옮길 수 있어요</p>`,'bp')}
function doUp(i){const p=curP()[i];const c=upCost(p);if(!canPay(c)||p.lv>=5||p.lv>=S.k+1)return;pay(c);p.lv++;snd('build');renderMap();renderTop();bPanel(i);const el=document.querySelector(`.plot[data-i="${i}"]`);if(el){el.classList.add('new');floatAt(el,'⬆️ Lv'+p.lv,'#2b8a3e')}checkQuest();save()}
function demolish(i,b){if(!b.dataset.ok){b.dataset.ok=1;b.textContent='정말 철거할까요? (한 번 더)';return}const P=curP(),p=P[i];const back=scale(BD[p.t].cost,.3);for(const k in back)S.res[k]+=back[k];delete P[i];closeM();renderMap();renderTop();toast('🧹 철거했어요. 재료 일부를 돌려받았어요');save()}
function castlePanel(){if(examGuard())return;const c=castleCost(),need=CR[S.k]||0,max=S.k>=10;const ok=!max&&canPay(c)&&S.total>=need;
 openM(`<h2>🏰 과학의 성 <span style="font-size:18px">Lv${S.k}</span></h2><div class="big">${artOf('castle',S.k)}</div><p style="text-align:center;font-family:Jua;font-size:20px">${TITLES[S.k-1]}</p><p style="text-align:center;font-size:14px">성은 1분마다 💰${2*S.k} 세금을 걷어요.</p>
 ${max?`<p style="text-align:center;font-family:Jua;font-size:20px;margin-top:8px">👑 왕국이 완성됐어요! 정말 대단해요!</p>`:`<h3 style="text-align:center;margin-top:10px">다음 레벨: ${TITLES[S.k]}</h3><div class="req">${costHtml(c)}<span class="cost ${S.total<need?'bad':''}">✔ 정답 ${S.total}/${need}</span></div><p style="text-align:center;font-size:14px">성을 올리면 땅 3칸이 개척되고 새 건물이 열려요!</p>`}
 <div class="row">${max?'':`<button class="btn main" ${ok?'':'disabled'} onclick="upCastle()">👑 성 업그레이드</button>`}</div>`,'castle')}

let AC=null,NB=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function noiseBuf(){if(NB)return NB;const a=ac();NB=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NB}
function noise(t,dur,vol,f0,f1){const a=ac();const s=a.createBufferSource();s.buffer=noiseBuf();const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1||f0,t+dur);const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+dur+.05)}
function tone(t,f,dur,vol,type='triangle'){const a=ac();const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function snd(type){if(!S||!S.sound)return;try{const a=ac();if(!a)return;let t=a.currentTime;
 if(type==='clash'){noise(t,.12,.25,3000,800);tone(t,140,.15,.18,'square');return}
 if(type==='whoosh'){noise(t,.45,.18,300,2500);return}
 if(type==='cheer'){[523,659,784].forEach((f,i)=>tone(t+i*.04,f,.5,.08));noise(t,.7,.06,1200,900);return}
 if(type==='drum'){tone(t,110,.18,.25,'sine');return}
 const seq={ok:[[660,.08],[880,.14]],no:[[260,.12],[200,.2]],build:[[440,.06],[554,.06],[659,.12]],lv:[[523,.1],[659,.1],[784,.1],[1047,.3]],click:[[700,.03]],coin:[[988,.05],[1319,.1]],alarm:[[520,.12],[390,.12],[520,.12],[390,.16]]}[type];if(!seq)return;
 for(const[f,d]of seq){tone(t,f,d,.13);t+=d*.9}}catch(e){}}
let bgm={mode:null,next:0,step:0};
const BGM={peace:{dur:.34,notes:[262,330,392,523,392,330,294,392,440,392,330,294],bass:[131,131,98,110],type:'triangle',vol:.035},
 war:{dur:.26,notes:[220,262,330,262,247,294,330,294,220,262,349,330],bass:[110,110,87,98],type:'square',vol:.018,drum:true},
 battle:{dur:.19,notes:[330,392,440,392,330,294,262,294,330,392,494,440],bass:[82,82,98,73],type:'sawtooth',vol:.014,drum:true}};
function bgmMode(force){if(!S||!S.bgm||!started){bgm.mode=null;return}bgm.mode=force||(B||mOpen==='battle'||mOpen==='atkalert'?'battle':S.nations.some(n=>n.war&&!n.fallen)?'war':'peace')}
setInterval(()=>{if(!bgm.mode||!AC||AC.state!=='running')return;const P=BGM[bgm.mode];const a=AC;if(bgm.next<a.currentTime)bgm.next=a.currentTime+.05;
 while(bgm.next<a.currentTime+.25){const i=bgm.step%P.notes.length;tone(bgm.next,P.notes[i],P.dur*.9,P.vol,P.type);if(i%3===0)tone(bgm.next,P.bass[(bgm.step/3|0)%P.bass.length],P.dur*2.6,P.vol*1.4,'sine');if(P.drum&&i%2===0){tone(bgm.next,90,.12,.05,'sine');if(i%4===2)noise(bgm.next,.06,.03,4000)}bgm.next+=P.dur;bgm.step++}},90);

const SALT='sk-kingdom-2026-🔬';
function cyrb(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const b64e=o=>{const b='SK'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));return b+'.'+cyrb(b+SALT)};
function b64v(s){s=String(s).trim();if(!s.startsWith('SK'))throw 0;const[b,sig]=s.split('.');const o=JSON.parse(decodeURIComponent(escape(atob(b.slice(2)))));return{o,sig:sig?(sig===cyrb(b+SALT)?'ok':'bad'):'none'}}
const b64d=s=>b64v(s).o;

 const avg=fn=>Math.round(rs.reduce((a,r)=>a+fn(r),0)/rs.length);
 const fAcc=FK.map((f,i)=>{const c=rs.reduce((a,r)=>a+r.st[i][0],0),w=rs.reduce((a,r)=>a+r.st[i][1],0);return[f,c+w?c/(c+w):1]});const weak=fAcc.filter(x=>x[1]<1).sort((a,b)=>a[1]-b[1])[0];
 const now=Date.now();const sigTag=r=>live?(now-(r.at||0)<90000?'🟢':'⚪'):r._sig==='ok'?'✅':r._sig==='bad'?'<b style="color:#c0392b">⚠️변조</b>':'❔';
 const items={};rs.forEach(r=>(r.lg||[]).forEach(([q,f,ok,my,a])=>{const it=items[q]=items[q]||{q,f,a,n:0,w:0,my:{}};it.n++;if(!ok){it.w++;it.my[my]=(it.my[my]||0)+1}}));
 const top=Object.values(items).filter(x=>x.n>=2&&x.w>0).sort((a,b)=>b.w/b.n-a.w/a.n||b.w-a.w).slice(0,10);
 return `<div class="req"><span class="rw">👥 ${rs.length}명</span><span class="rw">✔ 평균 정답 ${avg(r=>r.c)}</span><span class="rw">🎯 평균 정답률 ${avg(r=>r.tr?r.c/r.tr*100:0)}%</span>${rs.some(r=>r.ex)?`<span class="rw">📝 시험 평균 ${avg(r=>r.ex?r.ex.c/r.ex.n*100:0)}점</span>`:''}${weak?`<span class="rw" style="background:#fff3c4">💪 약한 분야: ${FIELDS[weak[0]].n}</span>`:''}${bad?`<span class="rw">⚠️ 읽지 못한 코드 ${bad}개</span>`:''}</div>
 <div style="overflow:auto"><table class="ttab"><tr><th>순위</th><th>${live?'접속':'확인'}</th><th>이름</th><th>정답</th><th>정답률</th>${FK.map(f=>`<th>${FIELDS[f].ic}</th>`).join('')}<th>연속</th><th>목표</th><th>📝시험</th><th>점수</th></tr>${rs.map((r,i)=>`<tr><td>${i+1}</td><td>${sigTag(r)}</td><td><a href="#" onclick="stuDetail(${i});return false">${esc(r.n)}</a></td><td>${r.c}</td><td>${pct(r.c,r.tr-r.c)}</td>${r.st.map(s=>`<td>${pct(s[0],s[1])}</td>`).join('')}<td>${r.b}</td><td>${r.cg?Math.min(r.cd,r.cg)+'/'+r.cg+(r.cd>=r.cg?'✅':''):'-'}</td><td>${r.ex?`${Math.round(r.ex.c/r.ex.n*100)}점`:'-'}</td><td><b>${r.sc}</b></td></tr>`).join('')}</table></div>
 <h3 style="margin-top:12px">🔍 많이 틀린 문제 TOP ${top.length}</h3>${top.length?`<div class="items">${top.map((x,i)=>{const mw=Object.entries(x.my).sort((a,b)=>b[1]-a[1])[0];return `<div class="item"><b>${i+1}. ${FIELDS[x.f]?FIELDS[x.f].ic:''} ${esc(x.q)}</b><div class="bar" style="height:12px;margin:3px 0"><i style="width:${Math.round(x.w/x.n*100)}%;background:#ff8f8f"></i></div><small>오답률 ${Math.round(x.w/x.n*100)}% (${x.w}/${x.n}) · 정답: <b style="color:#2b8a3e">${esc(x.a)}</b>${mw?` · 가장 많이 고른 오답: <b style="color:#c0392b">${esc(mw[0])}</b> (${mw[1]}명)`:''}</small></div>`}).join('')}</div>`:'<p style="font-size:13px">아직 분석할 기록이 부족해요. (수업 코드로 입장한 뒤 푼 문제만 기록돼요)</p>'}`}
function stuDetail(i){const r=lastRS[i];if(!r)return;const pct=(c,w)=>c+w?Math.round(c/(c+w)*100):0;
 const wr=(r.lg||[]).filter(x=>!x[2]);const units={};(r.lg||[]).forEach(([q,f,ok])=>{const raw=QB[r.lv]&&QB[r.lv].find(x=>x[1].startsWith(q));const u=raw?unitOf(f,raw):'선생님 문제';const k=FIELDS[f].ic+' '+u;units[k]=units[k]||[0,0];units[k][ok?0:1]++});
 const d=document.createElement('div');d.className='qrfull';d.innerHTML=`<div class="stud"><h2>👤 ${esc(r.n)} <small>${(LEVELS[r.lv]||['?'])[0]} · ⭐${r.sc}점 · ${r.d||''}</small></h2>
 <div class="req"><span class="rw">✔ 정답 ${r.c}/${r.tr}</span><span class="rw">🔥 최고 ${r.b}연속</span>${r.ex?`<span class="rw">📝 시험 ${r.ex.c}/${r.ex.n} (${Math.round(r.ex.s/60)}분 ${r.ex.s%60}초)</span>`:''}${r.cg?`<span class="rw">🎯 목표 ${Math.min(r.cd,r.cg)}/${r.cg}</span>`:''}</div>
 ${FK.map((f,j)=>{const p=pct(r.st[j][0],r.st[j][1]);return `<div class="frow"><b class="j">${FIELDS[f].ic} ${FIELDS[f].n}</b><div class="bar"><i style="width:${p}%;background:${FIELDS[f].c}"></i></div><span>${r.st[j][0]+r.st[j][1]?p+'%':'-'}</span></div>`}).join('')}
 ${Object.keys(units).length?`<h3>📚 단원별 (수업 중 기록)</h3><div class="req" style="justify-content:flex-start">${Object.entries(units).map(([k,[c,w]])=>`<span class="rw" style="background:${w>c?'#ffd6d6':'#e9ffe2'}">${k} ${c}/${c+w}</span>`).join('')}</div>`:''}
 <h3>❌ 틀린 문제 ${wr.length}개</h3>${wr.slice(-15).reverse().map(x=>`<div class="wl"><b>${esc(x[0])}</b><br><span class="a">정답: ${esc(x[4])}</span> · <span class="m">고른 답: ${esc(x[3])}</span></div>`).join('')||'<p>없음 👍</p>'}
 <div class="row"><button class="btn main" onclick="this.closest('.qrfull').remove()">닫기</button></div></div>`;document.body.appendChild(d)}

/* 학생: 수업 입장 */
function applyCls(o,room){S.cls={id:o.id||rid(6),name:o.name,fields:o.fields,unit:o.unit||'',goal:o.goal,qs:o.qs||[],only:!!o.only,exam:o.exam||null,room:room||null,league:o.league||null};S.lvl=o.lvl;S.clsDone=0;S.clsLog=[];S.field=o.fields.length===1?o.fields[0]:'mix';S.unit=o.unit||null;recent=[];onlineDirty=true;save();renderTop();renderQuest()}
function joinCls(code){try{const v=b64v(code??$('#cc').value);if(v.o.t!=='c')throw 0;applyCls(v.o);toast(`📚 수업 "${v.o.name}"에 들어왔어요!${v.o.exam?' 📝 시험이 있어요!':''}`,3000);openSettings()}catch(e){toast('⚠️ 올바른 반 코드가 아니에요')}}
function leaveCls(){S.cls=null;S.unit=null;S.field='mix';save();renderTop();renderQuest();openSettings()}

/* 문제 뽑기 (직접 낸 문제 포함) */
function customQ(f){const qs=(S.cls&&S.cls.qs)||[];const pool=qs.filter(x=>!f||x[0]===f);if(!pool.length)return null;let p2=pool.filter(x=>!recent.includes(x[1]));if(!p2.length)p2=pool;const raw=rnd(p2);recent.push(raw[1]);if(recent.length>60)recent.shift();return variantQ({f:raw[0],q:raw[1],a:raw[2],opts:shuffle(raw.slice(2,6)),ex:raw[6],done:false,fixed:false,lv:S.lvl,custom:true})}
function nextClassQ(f){if(S.cls&&S.cls.qs&&S.cls.qs.length){if(S.cls.only)return customQ(null);if(Math.random()<.4){const c=customQ(f);if(c)return c}}return pickQ(f)}
function newQ(){if(examGuard())return;const al=allowedFields();let f=S.field==='mix'||!al.includes(S.field)?(S.crisis&&al.includes(S.crisis.f)&&Math.random()<.5?S.crisis.f:rnd(al)):S.field;Q=nextClassQ(f);Q.gold=Math.random()<.1;drawQ()}

/* 2 시험 모드 */
let examTimer=null;
const examAvail=()=>S.cls&&S.cls.exam&&!(S.examRes&&S.examRes[S.cls.id])&&!S.exam;
function examGuard(){if(S&&S.exam){showExam();return true}return false}
function examIntro(){if(!examAvail())return;const e=S.cls.exam;openM(`<h2 style="text-align:center">📝 ${esc(S.cls.name)} 시험</h2><div class="req"><span class="rw">📄 ${e.n}문제</span><span class="rw">⏱️ ${e.min}분</span><span class="rw">🔒 한 번만</span></div><p style="text-align:center">시험 중에는 풀이가 나오지 않고, 왕국 기능이 잠겨요.<br>끝나면 점수와 풀이를 한꺼번에 보여 줘요. 준비됐나요?</p><div class="row"><button class="btn main" onclick="startExam()">✏️ 시험 시작</button><button class="btn" onclick="closeM()">나중에</button></div>`,'examintro')}
function startExam(){if(!examAvail())return;const e=S.cls.exam;const qs=[];const al=allowedFields();let guard=0;NOOX=true;while(qs.length<e.n&&guard++<e.n*6){const q=nextClassQ(rnd(al));if(!qs.some(x=>x.q===q.q))qs.push(q)}NOOX=false;
 S.exam={id:S.cls.id,qs,i:0,ans:[],t0:Date.now(),end:Date.now()+e.min*60000};save();snd('lv');showExam()}
function showExam(){const E=S.exam;if(!E)return;if(Date.now()>=E.end||E.i>=E.qs.length)return finishExam();const q=E.qs[E.i],F=FIELDS[q.f];
 openM(`<div class="exhead"><b class="j">📝 시험 ${E.i+1}/${E.qs.length}</b><span class="j" id="extime"></span></div><div class="bar" style="height:10px"><i style="width:${E.i/E.qs.length*100}%;background:#7ec8ff"></i></div>
 <div class="qcard" style="margin-top:8px"><span class="qtag" style="background:${F.c}">${F.ic} ${F.n}</span><div class="qtext">${q.disp||q.q}</div></div>
 <div id="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="exAns(${i},event)"><b>${i+1}</b><span>${o}</span></button>`).join('')}</div><p style="text-align:center;font-size:13px;color:#8a7a9a">답을 고르면 바로 다음 문제로 넘어가요</p>`,'exam');markShown();
 clearInterval(examTimer);const tick=()=>{if(!S.exam){clearInterval(examTimer);return}const left=Math.max(0,S.exam.end-Date.now());const el=$('#extime');if(el)el.textContent=`⏱️ ${Math.floor(left/60000)}:${String(Math.floor(left%60000/1000)).padStart(2,'0')}`;if(left<=0){clearInterval(examTimer);finishExam()}};tick();examTimer=setInterval(tick,500)}
function exAns(i,ev){const E=S.exam;if(!E)return;const q=E.qs[E.i];if(i>=q.opts.length)return;const ok=q.opts[i]===q.a;if(macroCheck(ok,ev))return;E.ans.push([i,ok?1:0]);S.tries++;if(ok){S.total++;S.stats[q.f].c++;gainCorrect(q)}else{S.stats[q.f].w++;S.wrong.unshift(wrongRec(q,i));S.wrong=S.wrong.slice(0,40)}clsLogPush(q,q.opts[i],ok);E.i++;snd('click');save();showExam()}
function finishExam(){const E=S.exam;if(!E)return;clearInterval(examTimer);const c=E.ans.filter(a=>a[1]).length,n=E.qs.length,s=Math.round((Math.min(Date.now(),E.end)-E.t0)/1000);
 S.examRes=S.examRes||{};S.examRes[E.id]={c,n,s};const g=20*c;S.res.gold+=g;S.exam=null;onlineDirty=true;pushOnline(true);save();snd(c/n>=.8?'cheer':'lv');if(c/n>=.8)confetti();
 const rows=E.qs.map((q,j)=>{const a=E.ans[j];return `<div class="wl">${a?(a[1]?'✅':'❌'):'⏰'} <b>${q.q}</b><br><span class="a">정답: ${q.a}</span>${a&&!a[1]?` · <span class="m">내 답: ${q.opts[a[0]]}</span>`:''}<br><span style="color:#6b5b7b">💡 ${q.ex}</span></div>`}).join('');
 mOpen=null;openM(`<h2 style="text-align:center">📝 시험 끝!</h2><div class="stamp" style="float:none;margin:6px auto;width:110px;height:110px;font-size:30px">${Math.round(c/n*100)}점</div><div class="req"><span class="rw">✅ ${c}/${n}</span><span class="rw">⏱️ ${Math.floor(s/60)}분 ${s%60}초</span><span class="rw">💰+${g}</span></div><p style="text-align:center;font-size:14px">${S.cls&&S.cls.room?'🌐 결과가 선생님께 자동으로 전송됐어요!':'📒 연구 노트에서 결과 코드를 복사해 선생님께 내요.'}</p><h3>📖 풀이</h3>${rows}<div class="row"><button class="btn main" onclick="closeM()">확인</button></div>`,'examres');renderTop();renderQuest()}

/* 9 칠판 퀴즈쇼 */
let SH=null;
function startShow(){const o=formCls();if(!o)return;const n=Math.max(3,Math.min(40,+$('#sn').value||10)),sec=Math.max(0,Math.min(120,+$('#st').value||0)),g=+$('#sg').value||0;
 const keep={cls:S.cls,lvl:S.lvl};S.cls=o;S.lvl=o.lvl;const qs=[];let guard=0;while(qs.length<n&&guard++<n*8){const q=nextClassQ(rnd(o.fields));if(!qs.some(x=>x.q===q.q))qs.push(q)}S.cls=keep.cls;S.lvl=keep.lvl;
 SH={name:o.name,qs,i:0,sec,rev:false,teams:Array.from({length:g},(_,i)=>({n:['🔴 빨강','🔵 파랑','🟡 노랑','🟢 초록','🟣 보라','🟠 주황'][i],s:0})),t:0};closeM();
 let el=$('#show');if(!el){el=document.createElement('div');el.id='show';document.body.appendChild(el)}el.style.display='flex';drawShow()}
function drawShow(){const el=$('#show');if(!SH){el.style.display='none';return}clearInterval(SH.tm);
 if(SH.i>=SH.qs.length){const best=SH.teams.slice().sort((a,b)=>b.s-a.s);el.innerHTML=`<div class="shend"><h1>🏆 퀴즈쇼 끝!</h1>${best.length?best.map((t,i)=>`<div class="shteam big">${i===0?'👑':''} ${t.n} <b>${t.s}점</b></div>`).join(''):'<p>수고했어요! 👏</p>'}<button class="btn main" onclick="SH=null;drawShow()">닫기</button></div>`;confetti();snd('cheer');return}
 const q=SH.qs[SH.i],F=FIELDS[q.f];const cols=['#ff6b6b','#4dabf7','#ffd43b','#69db7c'];
 el.innerHTML=`<div class="shtop"><b>📺 ${esc(SH.name)}</b><span>${F.ic} ${F.n} · 문제 ${SH.i+1}/${SH.qs.length}</span>${SH.sec?`<span class="shtime" id="sht">${SH.sec}</span>`:''}<button class="btn sm" onclick="SH=null;drawShow()">✕ 종료</button></div>
 <div class="shq">${q.disp||q.q}</div><div class="shopts">${q.opts.map((o,i)=>`<div class="sho ${SH.rev?(o===q.a?'ok':'dim'):''}" style="background:${cols[i]}"><b>${i+1}</b>${o}</div>`).join('')}</div>
 ${SH.rev?`<div class="shex">💡 ${q.ex}</div>`:''}
 <div class="shbot">${SH.teams.map((t,i)=>`<div class="shteam">${t.n} <b>${t.s}</b><button class="btn sm" onclick="SH.teams[${i}].s++;drawShow()">+1</button><button class="btn sm" onclick="SH.teams[${i}].s=Math.max(0,SH.teams[${i}].s-1);drawShow()">-1</button></div>`).join('')}
 <button class="btn main" onclick="${SH.rev?'SH.i++;SH.rev=false;SH.t=0;drawShow()':'SH.rev=true;snd(\'ok\');drawShow()'}">${SH.rev?'다음 문제 ▶':'✅ 정답 공개'}</button></div>`;
 if(SH.sec&&!SH.rev){SH.t=SH.t||Date.now();SH.tm=setInterval(()=>{const left=Math.max(0,SH.sec-Math.floor((Date.now()-SH.t)/1000));const e=$('#sht');if(e){e.textContent=left;e.classList.toggle('low',left<=5)}if(left<=0){clearInterval(SH.tm);snd('alarm')}},250)}}
document.addEventListener('keydown',e=>{if(!SH||$('#show').style.display==='none')return;if(e.key===' '||e.key==='Enter'){e.preventDefault();if(SH.i>=SH.qs.length)return;if(SH.rev){SH.i++;SH.rev=false;SH.t=0}else{SH.rev=true;snd('ok')}drawShow()}else if(e.key==='Escape'){SH=null;drawShow()}});

 if(!liveRoom)return `<p style="font-size:14px">🌐 <b>온라인 반</b>을 만들면 학생들이 짧은 <b>반 번호</b>로 입장하고, 푸는 결과가 이 화면에 <b>실시간</b>으로 올라와요. (닉네임만 쓰고 실명은 쓰지 않게 안내해 주세요)</p>${makeForm('live').replace('🎫 수업 코드 만들기','🌐 온라인 반 열기').replace('makeCls()','openRoom()')}

 return `<div class="req"><span class="rw" style="font-size:22px">🏫 반 번호 <b>${liveRoom}</b></span><button class="btn sm" onclick="copyText('${liveRoom}',this)">📋</button><button class="btn sm blue" onclick="roomQR()">📱 QR</button><button class="btn sm" onclick="liveRoom=null;openTeacher('live')">반 닫기</button></div>
 <p style="font-size:13px;text-align:center">학생: ⚙️설정 › 🌐 온라인 반 입장 › 반 번호 <b>${liveRoom}</b> 입력</p>
 <div class="leaguebox"><b>🏆 반 대항전</b> ${leagueCode?`대항전 코드 <b>${leagueCode}</b> <button class="btn sm" onclick="copyText('${leagueCode}',this)">📋</button>`:`<input id="lgn" placeholder="우리 반 이름 (예: 5학년 3반)" maxlength="12"><button class="btn sm green" onclick="joinLeague(true)">새 대항전 만들기</button><input id="lgc" placeholder="대항전 코드" maxlength="6" style="width:90px"><button class="btn sm" onclick="joinLeague(false)">참가</button>`}<div id="lgres"></div></div>
 <div id="tres"><p>⏳ 학생 결과를 불러오는 중...</p></div>`}

 if(c.ship){S.fleet=(S.fleet||0)+c.ship;parts.push('⛵함선 '+c.ship+'척')}if(c.rp){S.rp=(S.rp||0)+c.rp;parts.push('🧪연구점수 '+c.rp)}
