<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>수학 히어로</title>
<style>
@font-face{font-family:Galmuri;src:url(Galmuri11-Bold.woff2) format('woff2');font-display:block}
:root{--ink:#22223b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#22223b;color:#fff;font-family:Galmuri,monospace;-webkit-font-smoothing:none;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
img.px{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.sh{text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),3px 3px var(--ink),-3px 3px var(--ink),3px -3px var(--ink),-3px -3px var(--ink),0 6px var(--ink)}
.sh2{text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink)}
.pbox{background:#fff4dc;color:var(--ink);border:4px solid var(--ink);box-shadow:inset -4px -4px 0 #e6cf9f,inset 4px 4px 0 #fff,0 8px 0 rgba(0,0,0,.45)}
.pbtn{background:var(--c,#ffd43b);color:var(--ink);border:4px solid var(--ink);box-shadow:inset -4px -4px 0 rgba(0,0,0,.2),inset 4px 4px 0 rgba(255,255,255,.5),0 6px 0 var(--ink);transition:transform .06s}
.pbtn:hover:not(:disabled){transform:translateY(-2px)}
.pbtn:active:not(:disabled){transform:translateY(4px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.2),inset 4px 4px 0 rgba(255,255,255,.5),0 2px 0 var(--ink)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.popin{animation:pop .18s steps(4)}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;padding:8px;padding-top:max(8px,env(safe-area-inset-top));pointer-events:none}
#hud[hidden]{display:none}
#xpbar{position:relative;height:24px;background:#3b2f57;border:4px solid var(--ink)}
#xpfill{height:100%;width:0;background:#4dabf7;box-shadow:inset 0 4px 0 #a5d8ff,inset 0 -4px 0 #1c7ed6}
#lvtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px}
#hudrow{display:flex;align-items:flex-start;gap:8px;margin-top:8px}
#slots{display:flex;flex-wrap:wrap;gap:6px;max-width:46%}
.slot{position:relative;width:40px;height:40px;background:#fff4dc;border:3px solid var(--ink);display:grid;place-items:center}
.slot img{width:28px;height:28px}
.slot b{position:absolute;right:-6px;bottom:-7px;font-size:12px;font-weight:400;background:#ffd43b;color:var(--ink);border:2px solid var(--ink);padding:0 3px;line-height:14px}
.slot.p{background:#d0ebff}
.slot.evo{background:#ffe066;box-shadow:0 0 0 3px #f08c00}
#timer{margin:0 auto;font-size:24px;line-height:1.1}
#right{display:flex;gap:6px;align-items:center;pointer-events:auto}
#kills{font-size:12px;margin-right:4px}
.hbtn{width:40px;height:40px;font-size:16px}
#bossbar{position:fixed;left:50%;top:96px;transform:translateX(-50%);width:min(480px,86vw);height:28px;background:#3b2f57;border:4px solid var(--ink);pointer-events:none}
#bossbar[hidden]{display:none}
#bossfill{height:100%;width:100%;background:#cc5de8;box-shadow:inset 0 4px 0 #eebefa,inset 0 -4px 0 #862e9c}
#bossname{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px}

/* 화면 공통 */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px}
.screen[hidden]{display:none}
.dim{background:rgba(34,34,59,.66)}

/* 타이틀 */
#title{background:linear-gradient(180deg,rgba(34,34,59,0) 0%,rgba(34,34,59,.55) 45%,rgba(34,34,59,.88) 100%)}
.tbox{width:min(760px,100%);text-align:center;max-height:100%;overflow:auto;padding:6px}
.theroes{display:flex;justify-content:center;gap:12px;margin-bottom:-4px}
#tHero,#tHero2{width:96px;height:96px;display:block;animation:bob 1s steps(2) infinite}
#tHero2{animation-delay:.5s}
@keyframes bob{50%{transform:translateY(-6px)}}
.logo{font-size:84px;line-height:1;color:#ffd43b;letter-spacing:4px;text-shadow:4px 0 var(--ink),-4px 0 var(--ink),0 4px var(--ink),0 -4px var(--ink),4px 4px var(--ink),-4px 4px var(--ink),4px -4px var(--ink),-4px -4px var(--ink),0 8px var(--ink),4px 8px var(--ink),-4px 8px var(--ink),0 12px #000}
.logo span{color:#ff6b6b}
.tag{display:inline-block;margin:14px 0 18px;font-size:12px;padding:8px 12px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gbtn{padding:12px 6px 10px}
.gbtn .num{font-size:24px}
.gbtn .tp{display:block;font-size:12px;margin-top:6px;line-height:1.35}
.gbtn .best{display:block;font-size:12px;margin-top:4px;color:#7a2d00}
.keys{margin-top:18px;font-size:12px;line-height:1.8}
@media(max-width:600px){.logo{font-size:48px;letter-spacing:2px}.grades{grid-template-columns:repeat(2,1fr)}#tHero,#tHero2{width:72px;height:72px}}

/* 퀴즈 */
.qcard{width:min(640px,100%);padding:18px 18px 22px;text-align:center;max-height:100%;overflow:auto}
.qhead{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:12px;margin-bottom:12px}
.gbadge{background:var(--c);border:3px solid var(--ink);padding:3px 8px}
#qStreak{color:#e8590c}
.qtext{font-size:36px;line-height:1.35;margin:4px 0 18px;word-break:keep-all}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{position:relative;min-height:76px;font-size:24px;padding:8px}
.opt:nth-child(1){--c:#ff8787}.opt:nth-child(2){--c:#74c0fc}.opt:nth-child(3){--c:#8ce99a}.opt:nth-child(4){--c:#ffd43b}
.opt .k{position:absolute;left:6px;top:6px;font-size:12px;background:#fff4dc;border:2px solid var(--ink);padding:0 4px;line-height:16px}
.opt.right{--c:#51cf66;outline:4px solid #fff}
.opt.wrong{--c:#adb5bd;opacity:.8}
.opt.fade{opacity:.35}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 .1em;font-size:.85em}
.frac i{font-style:normal;padding:0 .2em}
.frac i:first-child{border-bottom:.12em solid currentColor}
.qfeed{margin-top:16px}
.qfeed:empty{display:none}
.good{font-size:36px;color:#2f9e44}
.badbox{background:#fff0f0;border:4px dashed #e03131;padding:12px;text-align:left}
.badbox h3{font-size:24px;color:#e03131;font-weight:400}
.badbox .ans{font-size:24px;margin:6px 0}
.badbox .ex{font-size:12px;line-height:1.7;color:#4a3f5c}
.bigbtn{display:inline-block;margin:14px 4px 0;padding:12px 20px;font-size:24px}
@media(max-width:600px){.qtext{font-size:24px}.opt{font-size:24px;min-height:64px}}

/* 업그레이드 */
.upwrap{width:min(900px,100%);text-align:center;max-height:100%;overflow:auto;padding:4px}
.uptitle{font-size:36px;color:#ffd43b}
.upsub{margin:6px 0 14px;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.card{padding:14px 10px 12px;cursor:pointer;text-align:center;transition:transform .06s}
.card:hover{transform:translateY(-4px)}
.card.evo{background:#ffe066;box-shadow:inset -4px -4px 0 #f59f00,inset 4px 4px 0 #fff9db,0 0 0 4px #f08c00,0 8px 0 rgba(0,0,0,.45)}
.card .ic{width:60px;height:60px;display:block;margin:0 auto}
.card .nm{font-size:24px;margin:6px 0 4px}
.card .stars{font-size:12px;color:#f08c00;letter-spacing:2px}
.card .lv{display:inline-block;font-size:12px;border:2px solid var(--ink);padding:1px 6px;background:#e5dbff}
.card .lv.new{background:#ffd43b}
.card .ds{font-size:12px;line-height:1.6;color:#4a3f5c;margin-top:8px}
.card .hint{display:block;font-size:12px;color:#c2255c;margin-top:4px}
.chars{display:flex;gap:14px;justify-content:center;margin:10px 0 6px}
.cbtn{width:150px;padding:10px 6px 8px;font-size:24px}
.cbtn img{width:64px;height:64px;display:block;margin:0 auto 4px}
.cbtn.sel{--c:#ffe066;outline:4px solid #f08c00}
.cbtn:not(.sel){--c:#fff4dc;opacity:.75}
@media(max-width:600px){.cbtn{width:120px}.cbtn img{width:48px;height:48px}}
.card .key{display:block;margin-top:8px;font-size:12px;color:#9a8db5}
.rbadge{display:inline-block;font-size:12px;color:#fff;padding:2px 8px;border:2px solid var(--ink);background:var(--rc)}
.card.r0{--rc:#868e96}.card.r1{--rc:#228be6;background:#e7f5ff}.card.r2{--rc:#7048e8;background:#f3f0ff}
.card.r3{--rc:#f76707;background:#fff4e6;box-shadow:inset -4px -4px 0 #ffc078,inset 4px 4px 0 #fff,0 0 0 4px #f76707,0 8px 0 rgba(0,0,0,.45)}
.card.r4{--rc:#e03131;background:#fff0f6;animation:myth .8s steps(2) infinite}
@keyframes myth{0%{box-shadow:inset -4px -4px 0 #ffa8a8,inset 4px 4px 0 #fff,0 0 0 4px #e03131,0 8px 0 rgba(0,0,0,.45)}100%{box-shadow:inset -4px -4px 0 #ffe066,inset 4px 4px 0 #fff,0 0 0 4px #fcc419,0 8px 0 rgba(0,0,0,.45)}}
.tlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.tlist span{font-size:12px;padding:2px 6px;border:2px solid var(--ink);background:var(--rc);color:#fff}

/* 결과 */
.rcard{width:min(660px,100%);padding:20px 18px;text-align:center;max-height:100%;overflow:auto}
.rcard h2{font-size:36px;font-weight:400}
.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
@media(max-width:560px){.rstats{grid-template-columns:repeat(2,1fr)}.rcard h2{font-size:24px}}
.rs{background:#e5dbff;border:3px solid var(--ink);padding:8px 4px}
.rs span{display:block;font-size:12px;color:#5f3dc4}
.rs b{font-weight:400;font-size:24px}
.review{text-align:left;background:#fff;border:4px solid var(--ink);padding:12px}
.review h3{font-weight:400;font-size:24px;margin-bottom:6px}
.ritem{border-top:3px dashed #d0bfff;padding:8px 0}
.ritem:first-of-type{border-top:none}
.ritem .q{font-size:24px}
.ritem .a{color:#2f9e44;font-size:12px;margin-top:2px}
.ritem .e{font-size:12px;color:#5c5070;margin-top:2px;line-height:1.6}

#banner{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:ban 2.4s steps(24) forwards}
#banner .b1{font-size:48px;color:#ffd43b}
#banner .b2{font-size:12px;margin-top:10px}
@media(max-width:600px){#banner .b1{font-size:24px}}
@keyframes ban{0%{opacity:0;transform:scale(.6)}8%{opacity:1;transform:scale(1.1)}14%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
#toast{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);pointer-events:none;opacity:0;white-space:nowrap;font-size:12px;padding:10px 14px}
#toast.show{opacity:1}

/* ===== 둥근 창 (강화/무기선택/일시정지) ===== */
.cbox{width:min(560px,100%);max-height:100%;overflow:auto;background:#fff8ec;color:#5c3a1e;border:5px solid #c08552;border-radius:26px;padding:20px 18px 18px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.ctitle{font-size:24px;margin-bottom:6px}
.csub{font-size:12px;color:#8a6a4a;margin-bottom:12px}
.csub:empty{display:none}
.rows{display:flex;flex-direction:column;gap:12px;text-align:left}
.rowc{display:flex;align-items:center;gap:14px;background:#fffdf7;border:4px solid #c08552;border-radius:18px;padding:12px 14px;cursor:pointer;box-shadow:0 5px 0 rgba(120,80,40,.25);transition:transform .08s}
.rowc:hover{transform:translateY(-3px)}
.rowc:active{transform:translateY(2px)}
.rowc .ri{width:52px;height:52px;flex:none;border-radius:12px;background:#e6f4dc;display:grid;place-items:center;position:relative}
.rowc .ri img{width:36px;height:36px}
.rowc .ri img.sub{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px}
.rowc .rb{flex:1;min-width:0}
.rowc .rn{font-size:24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rowc .rd{font-size:12px;color:#7a5a3a;margin-top:4px;line-height:1.5}
.rowc .rk{font-size:12px;color:#b89a7a;flex:none}
.bdg{display:inline-block;font-size:12px;color:#fff;padding:3px 9px;border-radius:999px;background:#4dabf7}
.bdg.lv{background:#ff8a5c}.bdg.typ{background:#ff8a5c}.bdg.awk{background:linear-gradient(#ffd43b,#f08c00);color:#5c3a1e;border:2px solid #c77700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#8a5a00;background:#fff3bf;border:2px solid #f2c66d;border-radius:999px;padding:2px 9px;margin-top:6px}
.chip img{width:14px;height:14px}
.chip.ok{background:#d3f9d8;border-color:#69db7c;color:#2b8a3e}
.rowc.sel{border-color:#20c997;box-shadow:0 0 0 3px #c3fae8,0 5px 0 rgba(120,80,40,.25)}
.rowc.awk{background:linear-gradient(180deg,#fff3bf,#ffe066);border-color:#e8a400;box-shadow:0 0 0 3px #fff3bf,0 5px 0 rgba(160,100,0,.35);animation:awkglow 1s steps(2) infinite}
@keyframes awkglow{50%{border-color:#ffb700;box-shadow:0 0 0 3px #fff9db,0 0 18px #ffd43b,0 5px 0 rgba(160,100,0,.35)}}
.rowc.awk .ri{background:#fff9db}
.rowc.r1{border-color:#4dabf7}.rowc.r2{border-color:#845ef7}.rowc.r3{border-color:#f76707;background:#fff4e6}.rowc.r4{border-color:#e03131;background:#fff0f6;animation:myth2 .8s steps(2) infinite}
@keyframes myth2{50%{border-color:#fcc419}}
.cbtn2{display:inline-block;margin:14px 6px 0;padding:12px 26px;font-size:24px;border-radius:18px;color:#fff;border:none}
.cbtn2.green{background:linear-gradient(#63e6be,#20c997);box-shadow:0 6px 0 #0ca678;color:#fff}
.cbtn2.gray{background:#e9dcc7;color:#5c3a1e;box-shadow:0 6px 0 #b08a5a;font-size:12px;padding:12px 18px}
.cbtn2:active{transform:translateY(4px);box-shadow:none}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.pst{border:4px solid #a07850;border-radius:16px;padding:8px 6px;background:#fff}
.pst b{display:block;font-size:24px;font-weight:400}
.pst span{font-size:12px;color:#8a6a4a}
.ppanel{border:3px solid #f0c987;border-radius:14px;padding:10px 12px;margin-top:10px;text-align:left;background:#fffdf7}
.pph{font-size:12px;color:#8a5a00;margin-bottom:6px}
.pitem{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.pitem img{width:20px;height:20px}
.pitem .bdg{margin-left:auto;background:#63c7a0}
.pitem .bdg.awk{background:linear-gradient(#ffd43b,#f08c00)}
.pnone{font-size:12px;color:#b89a7a}
.pbtns{margin-top:6px}
.chars .cbtn{border-radius:16px}
/* ===== 각성 연출 ===== */
#awk{z-index:50;overflow:hidden;background:radial-gradient(circle at 50% 50%,#fff3bf 0%,#ffd43b 32%,#f5a300 66%,#8a5200 100%);animation:awkIn 2.4s ease-out forwards;pointer-events:auto}
.awkrays{position:absolute;inset:-60%;background:repeating-conic-gradient(rgba(255,255,255,.2) 0 8deg,transparent 8deg 16deg);animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes awkIn{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
.awkin{position:relative;text-align:center;animation:awkPop .5s ease-out}
@keyframes awkPop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.aq{font-size:24px;color:#6b3d00;margin-bottom:16px}
.an{display:flex;align-items:center;justify-content:center;gap:14px;font-size:48px;color:#fff;text-shadow:3px 0 #7a4a00,-3px 0 #7a4a00,0 3px #7a4a00,0 -3px #7a4a00,3px 3px #7a4a00,-3px 3px #7a4a00,3px -3px #7a4a00,-3px -3px #7a4a00,0 7px rgba(0,0,0,.25)}
.an img{width:56px;height:56px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
@media(max-width:600px){.an{font-size:24px}.aq{font-size:12px}.rowc .rn{font-size:12px}.ctitle{font-size:24px}}
/* ===== 새 HUD ===== */
#hud{position:fixed;inset:0;padding:0;pointer-events:none}
#xpbar{position:absolute;top:0;left:0;right:0;height:10px;border:none;background:rgba(34,34,59,.55)}
#xpfill{box-shadow:none;background:#4dabf7}
.pill{background:#fff4dc;color:#5c3a1e;border:3px solid #c08552;border-radius:999px;padding:5px 14px;font-size:12px;line-height:1.2;box-shadow:0 3px 0 rgba(0,0,0,.22);white-space:nowrap}
button.pill{pointer-events:auto;cursor:pointer}
button.pill:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.hl{position:absolute;left:12px;top:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.hr{position:absolute;right:12px;top:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.hc{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.tpill{font-size:36px;padding:2px 24px;border-radius:18px;margin:0;color:#5c3a1e}
#hpbar{position:relative;width:220px;height:20px;margin-top:-3px;background:#fff4dc;border:3px solid #c08552;border-radius:999px;overflow:hidden}
#hpfill{height:100%;width:100%;background:#ff6b6b;box-shadow:inset 0 3px 0 #ffa8a8;transition:width .15s}
#hptxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
#dock{position:absolute;left:50%;bottom:10px;padding-bottom:env(safe-area-inset-bottom);transform:translateX(-50%);display:flex;gap:12px}
.dpanel{background:rgba(70,55,40,.55);border-radius:14px;padding:6px 8px 8px;text-align:center}
.dt{font-size:12px;color:#fff;margin-bottom:5px}
.dslots{display:flex;gap:6px}
.ds{position:relative;width:44px;height:44px;border-radius:10px;border:2px dashed rgba(255,255,255,.45);background:rgba(255,255,255,.1)}
.ds.on{border:3px solid #c08552;background:#fff4dc}
.ds.evo{background:#ffe066;border-color:#f08c00}
.ds img{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:24px;height:24px}
.ds b{position:absolute;left:0;right:0;bottom:1px;font-size:12px;font-weight:400;color:#5c3a1e;line-height:12px}
#bossbar{top:118px}
#lvtxt,#kills{position:static;inset:auto;display:block;margin:0}
.ds{height:52px}.ds img{top:5px}
@media(max-width:600px){.tpill{font-size:24px}#hpbar{width:160px}.ds{width:38px;height:46px}.ds img{width:22px;height:22px;top:4px}.dslots{gap:4px}#dock{gap:6px}.hl,.hr{top:16px}#bossbar{top:96px}}

/* ===== 학교 테마: 칠판 HUD · 필통 슬롯 · 공책 창 ===== */
.pill{background:#2f4a3c;color:#f1f3e0;border:3px solid #9c6b3c;border-radius:6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),0 3px 0 rgba(0,0,0,.3)}
.tpill{background:#2f4a3c;color:#fff9db;border:4px solid #9c6b3c;border-radius:8px;padding:2px 22px}
#hpbar{background:#2f4a3c;border:3px solid #9c6b3c;border-radius:6px}
#hpfill{background:#ff6b6b;box-shadow:inset 0 3px 0 #ffa8a8}
#wrongTxt{color:#ffc9c9}
#accTxt{color:#b2f2bb}
.dpanel{position:relative;border-radius:16px;padding:16px 8px 8px}
.dpanel.w{background:#ff922b;border:3px solid #a8550f}
.dpanel.p{background:#4dabf7;border:3px solid #1864ab}
.dpanel::before{content:'';position:absolute;left:12px;right:12px;top:6px;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.35) 0 4px,rgba(255,255,255,.7) 4px 8px)}

<script>
/* ================= 기본 도구 ================= */
const TAU=Math.PI*2;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const $=s=>document.querySelector(s);
const gcd=(a,b)=>b?gcd(b,a%b):a, lcm=(a,b)=>a/gcd(a,b)*b;
function mkRand(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ================= 문제 ================= */
const F=(n,d)=>`[${n}/${d}]`;
const Fr=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):F(n,d);};
const J=(n,t)=>{const d=String(n).slice(-1),c=!'2459'.includes(d),l='178'.includes(d);return n+({은는:c?'은':'는',이가:c?'이':'가',을를:c?'을':'를',와과:c?'과':'와',로:c&&!l?'으로':'로'})[t];};
const nf=x=>String(+(+x).toFixed(4));
const show=v=>typeof v==='number'?(Math.abs(v)>=10000?v.toLocaleString('ko-KR'):nf(v)):v;
const fmt=s=>String(s).replace(/\[(\d+)\/(\d+)\]/g,'<span class="frac"><i>$1</i><i>$2</i></span>');
function autoD(a){
  if(Number.isInteger(a))return[a+1,a-1,a+2,a-2,a+10,a-10];
  const dec=(nf(a).split('.')[1]||'').length,u=Math.pow(10,-dec);
  return[a+u,a-u,a*10,a/10,a+1,a+2*u].map(x=>+x.toFixed(4));
}
function mk(q,a,e,ds,u=''){
  const A=show(a)+u,seen=new Set([A]),opts=[A];
  for(const c of shuffle((ds||autoD(a)).slice())){
    if(typeof c==='number'&&(!isFinite(c)||(typeof a==='number'&&a>=0&&c<0)))continue;
    const s=show(c)+u;if(!seen.has(s)){seen.add(s);opts.push(s);}
    if(opts.length===4)break;
  }
  let k=1;
  while(opts.length<4&&k<60){
    const c=typeof a==='number'?(Number.isInteger(a)?a+(k%2?1:-1)*(3+k):+(a+k*0.3).toFixed(2)):F(R(1,9),R(2,12));
    k++;if(typeof c==='number'&&c<0)continue;
    const s=show(c)+u;if(!seen.has(s)){seen.add(s);opts.push(s);}
  }
  return{q,a:A,e,opts:shuffle(opts)};
}

const TOPICS=[
 ['한 자리 덧셈','한 자리 뺄셈','10 모으기','두 자리 + 한 자리','두 자리 − 한 자리','10개씩 묶음 세기','받아올림 덧셈','받아내림 뺄셈','세 수의 덧셈'],
 ['받아올림 덧셈','받아내림 뺄셈','구구단','구구단 빈칸','곱셈 문장제','세 자리 수','길이 (m·cm)','덧셈 빈칸 □'],
 ['세 자리 덧셈','세 자리 뺄셈','두 자리 × 한 자리','나눗셈','나머지 있는 나눗셈','분수만큼 구하기','시간 (분)','소수 덧셈','원의 지름'],
 ['큰 수','두 자리 × 두 자리','나눗셈 (÷두 자리)','삼각형 각도','사각형 각도','분수 덧셈','분수 뺄셈','소수 덧셈','규칙 찾기'],
 ['혼합계산 (곱셈 먼저)','혼합계산 (괄호 먼저)','혼합계산 (나눗셈 먼저)','최대공약수','최소공배수','약분','분수 덧셈 (통분)','직사각형 넓이','삼각형 넓이','평균','소수 × 자연수'],
 ['분수 ÷ 자연수','분수 ÷ 분수','소수 ÷ 소수','백분율','비례식','비율','원의 넓이','원의 둘레','직육면체 부피'],
];
const GR=[
{n:1,col:'#ff8787',topic:'덧셈 · 뺄셈 · 10 만들기',gens:[
 ()=>{const a=R(1,8),b=R(1,9-a);return mk(`${a} + ${b} = ?`,a+b,`${a}에서 ${b}만큼 이어 세면 ${a+b}이에요.`);},
 ()=>{const a=R(3,9),b=R(1,a-1);return mk(`${a} - ${b} = ?`,a-b,`${a}개에서 ${b}개를 덜어 내면 ${a-b}개가 남아요.`);},
 ()=>{const a=R(1,9);return mk(`${J(a,'와과')} □를 모으면 10`,10-a,`${a}에 ${J(10-a,'을를')} 더하면 10이 돼요.`);},
 ()=>{const t=R(1,8),o=R(0,7),b=R(1,9-o),a=t*10+o;return mk(`${a} + ${b} = ?`,a+b,`일의 자리끼리 더해요: ${o}+${b}=${o+b}. 답은 ${a+b}`);},
 ()=>{const t=R(2,9),o=R(2,9),b=R(1,o),a=t*10+o;return mk(`${a} - ${b} = ?`,a-b,`일의 자리끼리 빼요: ${o}-${b}=${o-b}. 답은 ${a-b}`);},
 ()=>{const t=R(1,9),o=R(0,9);return mk(`10개씩 묶음 ${t}개와 낱개 ${o}개는?`,t*10+o,`10개씩 묶음 ${t}개는 ${t*10}, 낱개 ${o}개를 더하면 ${t*10+o}`,[o*10+t,t+o,t*10+o+10,t*10+o-1,t*10+o+1]);},
 ()=>{const a=R(4,9),b=R(11-a,9);return mk(`${a} + ${b} = ?`,a+b,`${a}에 ${J(10-a,'을를')} 먼저 더해 10을 만들고, 남은 ${J(b-(10-a),'을를')} 더하면 ${a+b}`);},
 ()=>{const a=R(11,18),b=R(a-9,9);return mk(`${a} - ${b} = ?`,a-b,`${a}에서 ${J(a-10,'을를')} 빼면 10, 10에서 ${J(b-(a-10),'을를')} 더 빼면 ${a-b}`);},
 ()=>{const a=R(1,9),c=R(1,9);return mk(`${a} + ${10-a} + ${c} = ?`,10+c,`${a}+${10-a}=10을 먼저 만들면 10+${c}=${10+c}`);},
]},
{n:2,col:'#ffa94d',topic:'받아올림 · 구구단 · 길이',gens:[
 ()=>{let a,b;do{a=R(15,68);b=R(12,89-a);}while(a%10+b%10<10);return mk(`${a} + ${b} = ?`,a+b,`일의 자리 ${a%10}+${b%10}=${a%10+b%10}, 10을 십의 자리로 받아올려요. 답은 ${a+b}`);},
 ()=>{let a,b;do{a=R(31,95);b=R(12,a-10);}while(a%10>=b%10);return mk(`${a} - ${b} = ?`,a-b,`일의 자리 ${a%10}에서 ${J(b%10,'을를')} 뺄 수 없으니 십의 자리에서 10을 빌려와요. 답은 ${a-b}`);},
 ()=>{const a=R(2,9),b=R(2,9);return mk(`${a} × ${b} = ?`,a*b,`${a}단: ${a} × ${b} = ${a*b}`,[a*(b+1),a*(b-1),a*b+1,a*b-1,(a+1)*b,a+b]);},
 ()=>{const a=R(2,9),b=R(2,9);return mk(`${a} × □ = ${a*b}`,b,`${a}단에서 ${a*b}가 나오는 건 ${a} × ${b}`);},
 ()=>{const a=R(2,9),b=R(2,9);return mk(`사탕이 한 봉지에 ${a}개씩 ${b}봉지 있어요. 모두 몇 개?`,a*b,`${a}개씩 ${b}묶음은 ${a} × ${b} = ${a*b}`,[a+b,a*b+a,a*b-a,a*b+1],'개');},
 ()=>{const h=R(1,9),t=R(0,9),o=R(0,9);return mk(`100이 ${h}개, 10이 ${t}개, 1이 ${o}개인 수는?`,h*100+t*10+o,`백의 자리 ${h}, 십의 자리 ${t}, 일의 자리 ${o} → ${h*100+t*10+o}`,[h*100+o*10+t,h*10+t+o,h*100+t*10+o+10,(h+1)*100+t*10+o,h*100+t*10+o+1]);},
 ()=>{const m=R(1,5),c=R(1,9)*10;return mk(`${m}m ${c}cm는 몇 cm?`,m*100+c,`1m = 100cm 이니까 ${m}m = ${m*100}cm, 더하면 ${m*100+c}cm`,[m*10+c,m+c,m*1000+c,m*100+c+10],'cm');},
 ()=>{const b=R(12,40),c=R(b+11,b+59);return mk(`□ + ${b} = ${c}`,c-b,`□ = ${c} - ${b} = ${c-b}`);},
]},
{n:3,col:'#ffd43b',topic:'세 자리 수 · 나눗셈 · 분수 · 시간',gens:[
 ()=>{const a=R(125,489),b=R(118,499);return mk(`${a} + ${b} = ?`,a+b,`일 → 십 → 백의 자리 순서로 더하고 받아올림을 잊지 마세요! 답은 ${a+b}`,[a+b+10,a+b-10,a+b+100,a+b-100,a+b+1]);},
 ()=>{const a=R(400,950),b=R(118,a-50);return mk(`${a} - ${b} = ?`,a-b,`일 → 십 → 백의 자리 순서로 빼요. 모자라면 윗자리에서 빌려와요. 답은 ${a-b}`,[a-b+10,a-b-10,a-b+100,a-b-100,a-b+1]);},

let ac=null,muted=false,sfxT={};
try{muted=localStorage.getItem('ms-mute')==='1';}catch(e){}
function AC(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac;}
function tone(f,d,type='sine',vol=.04,slide=0,delay=0){
  if(muted||!ac)return;
  try{const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
function sfx(n){
  if(S&&S.demo)return;
  const now=performance.now(),gap={shoot:70,hit:45,gem:28,zap:80}[n]||0;
  if(gap&&now-(sfxT[n]||0)<gap)return;sfxT[n]=now;
  switch(n){
    case'shoot':tone(900,.05,'square',.012,1300);break;
    case'hit':tone(220,.05,'square',.018,110);break;
    case'gem':tone(1100+Math.random()*300,.05,'sine',.025);break;
    case'hurt':tone(180,.25,'sawtooth',.05,70);break;
    case'zap':tone(1600,.14,'sawtooth',.025,180);break;
    case'boom':tone(110,.35,'sawtooth',.05,40);break;
    case'lv':[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.05,0,i*.07));break;
    case'right':[784,1047,1319].forEach((f,i)=>tone(f,.18,'triangle',.06,0,i*.08));break;
    case'wrong':tone(300,.18,'square',.04,200);tone(200,.3,'square',.04,140,.16);break;
    case'pick':tone(660,.1,'sine',.05,990);break;
    case'warn':[0,.25,.5].forEach(d=>tone(440,.18,'square',.04,330,d));break;
    case'win':[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.06,0,i*.12));break;
    case'lose':[392,330,262,196].forEach((f,i)=>tone(f,.3,'triangle',.06,0,i*.16));break;
  }
}

function bbox(c){const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>0){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  return{cx:(x0+x1+1)/2,cy:(y0+y1+1)/2,w:x1-x0+1,h:y1-y0+1};}

function updProj(dt){
  const p=S.p;
  for(const q of S.proj){
    if(q.k==='pencil'){
      const n=Math.max(1,Math.ceil(340*dt/6));
      for(let k=0;k<n&&!q.dead;k++){q.x+=q.vx*dt/n;q.y+=q.vy*dt/n;
        let hit=null,hd=1e9;near(q.x,q.y,40,e=>{if(q.hit.has(e))return;const d=(e.x-q.x)**2+(e.y-q.y)**2;if(d<(e.r+q.r)**2&&d<hd){hd=d;hit=e;}});
        if(hit){q.hit.add(hit);hurt(hit,q.dmg,q.vx/340,q.vy/340,120);if(--q.pierce<=0)q.dead=true;}}
      q.life-=dt;if(q.life<=0)q.dead=true;
    }else if(q.k==='boom'){
      q.t+=dt;q.spin+=dt*16;
      if(!q.back&&(Math.hypot(q.x-q.ox,q.y-q.oy)>=q.rng||q.t>.9))q.back=true;
      let mx,my;if(!q.back){const k=Math.max(.25,1-Math.hypot(q.x-q.ox,q.y-q.oy)/q.rng*.75);mx=q.vx*dt*k;my=q.vy*dt*k;}
      else{const dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1;mx=dx/d*380*dt;my=dy/d*380*dt;if(d<20||q.t>3)q.dead=true;}
      const n=Math.max(1,Math.ceil(Math.hypot(mx,my)/8));
      for(let k=0;k<n;k++){q.x+=mx/n;q.y+=my/n;near(q.x,q.y,40,e=>{const lt=q.hits.get(e)||0;if(S.t<lt)return;if((e.x-q.x)**2+(e.y-q.y)**2<(e.r+q.r)**2){q.hits.set(e,S.t+.4);const d=Math.hypot(e.x-q.x,e.y-q.y)||1;hurt(e,q.dmg,(e.x-q.x)/d,(e.y-q.y)/d,140);}});}
    }else if(q.k==='paint'){
      q.t+=dt;
      if(q.t>.12&&q.t<q.dur){const k=q.t/q.dur,gx=q.sx+(q.tx-q.sx)*k,gy=q.sy+(q.ty-q.sy)*k;let hit=false;
        near(gx,gy,40,e=>{if(!hit&&(e.x-gx)**2+(e.y-gy)**2<(e.r+8)**2)hit=true;});if(hit){q.tx=gx;q.ty=gy;q.t=q.dur;}}
      if(q.t>=q.dur){q.dead=true;
        S.fx.push({k:'splash',x:q.tx,y:q.ty,r:q.rad,ci:q.ci,t:.9});
        near(q.tx,q.ty,q.rad+30,e=>{const d=Math.hypot(e.x-q.tx,e.y-q.ty);if(d<q.rad+e.r*.5)hurt(e,q.dmg,(e.x-q.tx)/(d||1),(e.y-q.ty)/(d||1),220);});
        burst(q.tx,q.ty,PCOLS[q.ci],14,220);sfx('boom');S.shake=Math.max(S.shake,.12);}
    }
  }
  S.proj=S.proj.filter(q=>!q.dead);
}

function bossAI(e,dt){
  if(e.d.final&&!e.phase2&&e.hp<e.max/2){e.phase2=true;banner('2페이즈!','구구단 대왕이 화났다!');sfx('warn');S.shake=.6;}
  if(!e.act){
    const dx=S.p.x-e.x,dy=S.p.y-e.y,d=Math.hypot(dx,dy)||1,sp=e.d.spd*(e.phase2?1.3:1);
    if(d>40){e.x+=dx/d*sp*dt;e.y+=dy/d*sp*dt;}
    e.cd-=dt;if(e.cd<=0){const q=BAI[e.type].seq(e);e.act={k:q[e.si%q.length],t:0,n:0};e.si++;}
    return;
  }
  e.act.t+=dt;
  if(BAI[e.type][e.act.k](e,e.act,dt)){e.act=null;e.air=0;e.jumpH=0;e.cd=e.phase2?.7:1.2;}
}

function gainXp(v){const p=S.p;p.xp+=v*p.xpMul;while(p.xp>=p.xpNext){p.xp-=p.xpNext;p.lv++;p.xpNext=Math.floor(6+(p.lv-1)*5.5);S.pendingLv++;}}
function upPool(){
  const L=[];
  for(const id in WD){const w=S.weapons.find(x=>x.id===id);
    if(!w){if(S.weapons.length<MAXW)L.push({t:'w',id});}else if(w.lv<5)L.push({t:'w',id});else if(w.lv===5&&(S.pas[EVO[id].need]||0)>=EVO[id].lv)L.push({t:'evo',id});}
  const np=Object.keys(S.pas).length;
  for(const id in PD){const lv=S.pas[id]||0;if(lv<5&&(lv>0||np<MAXP))L.push({t:'p',id});}
  return L;
}
function choices(n){
  const pool=upPool(),evo=shuffle(pool.filter(u=>u.t==='evo')),rest=shuffle(pool.filter(u=>u.t!=='evo'));
  const L=evo.concat(rest).slice(0,n);while(L.length<Math.min(n,2))L.push({t:'heal'});return L;

function update(dt){
  S.t+=dt;if(!S.bossFight)S.clock+=dt;const p=S.p,m=S.clock/60;
  let dx=0,dy=0;
  if(S.demo){dx=Math.cos(S.t*.45)+.3*Math.sin(S.t*1.3);dy=Math.sin(S.t*.6);}
  else{
    if(keys.KeyA||keys.ArrowLeft)dx--;if(keys.KeyD||keys.ArrowRight)dx++;
    if(keys.KeyW||keys.ArrowUp)dy--;if(keys.KeyS||keys.ArrowDown)dy++;
    const j=S.joy;if(j.on){const jx=j.x-j.ox,jy=j.y-j.oy,l=Math.hypot(jx,jy);if(l>6){dx=jx/Math.max(l,45);dy=jy/Math.max(l,45);}}
  }
  let l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;l=1;}
  p.moving=l>0.05&&S.endT<0;
  if(p.moving){p.x+=dx*p.speed*dt;p.y+=dy*p.speed*dt;if(Math.abs(dx)>.1)p.face=dx>0?1:-1;p.mx=dx;p.my=dy;}
  p.iv=Math.max(0,p.iv-dt);
  if(p.regen&&S.endT<0)p.hp=Math.min(p.maxHp,p.hp+p.regen*dt);
  if(S.arena){const a=S.arena;p.x=clamp(p.x,a.x-a.w+10,a.x+a.w-10);p.y=clamp(p.y,a.y-a.h+12,a.y+a.h-8);}

  if(S.endT<0){
    const rate=1.1+m*.62;
    if(!S.bossFight){S.spAcc+=rate*dt;while(S.spAcc>=1){S.spAcc--;if(S.en.length<260)spawnEnemy(pickType());}}
    if(!S.bossFight&&S.miniIdx<MINI_AT.length&&S.clock>=MINI_AT[S.miniIdx]){const t=S.miniIdx%2?'clock':'homework';S.miniIdx++;const e=spawnEnemy(t);
      for(let i=0;i<4;i++){const a=i/4*TAU;spawnEnemy('worm',e.x+Math.cos(a)*40,e.y+Math.sin(a)*40);}banner('준보스 등장!',ED[t].name+'가 책벌레를 데려왔다!');sfx('warn');}
    if(!S.bossFight&&S.traitIdx<TRAIT_AT.length&&S.clock>=TRAIT_AT[S.traitIdx]){S.traitIdx++;spawnEnemy('spirit');banner('특성 몬스터 등장!','별빛 정령을 잡으면 특성을 골라요');sfx('warn');}
    if(!S.bossFight&&!S.demo&&S.clock>=S.nextBonus){S.nextBonus+=120;S.bonusPending=true;}
    if(!S.bossFight&&S.clock>=S.nextElite&&S.nextElite<900){S.nextElite+=90;spawnEnemy('golem');banner('바위 골렘 등장!','물리치면 보물상자를 떨어뜨려요');sfx('warn');}
    if(!S.bossFight&&S.ring<3&&S.clock>=[150,450,750][S.ring]){S.ring++;for(let i=0;i<26;i++){const a=i/26*TAU;spawnEnemy('bat',p.x+Math.cos(a)*400,p.y+Math.sin(a)*400);}banner('박쥐 떼 포위!','틈을 찾아 빠져나가요!');sfx('warn');}
    if(!S.bossFight&&S.bossIdx<3&&S.clock>=BOSSES[S.bossIdx].at){S.bossFight=true;S.warn=2.4;const d=ED[BOSSES[S.bossIdx].id];
      banner('⚠ WARNING ⚠',d.name+(d.final?' 등장! 물리치면 승리!':' 등장!'));sfx('warn');}
    if(S.warn>0){S.warn-=dt;if(Math.floor(S.warn*4)%2===0&&Math.floor((S.warn+dt)*4)%2===1)sfx('warn');if(S.warn<=0)startArena();}

  }

      if(dd<rr*rr&&dd>.01){const D=Math.sqrt(dd),push=(rr-D)*.5;e.x+=ox/D*push*.5;e.y+=oy/D*push*.5;n++;}});
    if(!S.arena&&!e.d.boss&&!e.d.elite&&(Math.abs(e.x-p.x)>hw*1.9+80||Math.abs(e.y-p.y)>hh*1.9+80)){[e.x,e.y]=spawnPos();}
    if(e.type==='homework'){e.bt-=dt;if(e.bt<=0){e.bt=4;const a=Math.atan2(p.y-e.y,p.x-e.x);for(let i=-2;i<=2;i++)bshot(e.x,e.y,a+i*.22,150,'paper',{dmg:9,r:4});sfx('shoot');}}
    if(e.type==='clock'){e.bt-=dt;if(e.bt<=0&&d<260){e.bt=4.5;e.stop=1.1;tele({k:'circ',x:e.x,y:e.y,r:95,warn:.95,dmg:14,fire:h=>{S.shake=.4;sfx('zap');S.fx.push({k:'ring',x:h.x,y:h.y,r:95,t:.35,col:'#ffd43b'});}});}}
    if(e.d.trait){e.bt-=dt;if(e.bt<=0){e.bt=3.2;for(let i=0;i<8;i++)bshot(e.x,e.y,i/8*TAU+S.t,130,'star',{dmg:8,r:4});}}
    if(S.arena){const a=S.arena;e.x=clamp(e.x,a.x-a.w+6,a.x+a.w-6);e.y=clamp(e.y,a.y-a.h+6,a.y+a.h-6);}
    if(!e.air&&(e.alpha??1)>.5&&d<e.r+p.r)hitPlayer(e.d.dmg);
  }
  const nb=[];
  for(const q of S.eb){q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;
    if(q.split!==undefined){q.split-=dt;if(q.split<=0){q.t=0;for(let i=0;i<6;i++){const a=i/6*TAU+S.t;nb.push({x:q.x,y:q.y,vx:Math.cos(a)*165,vy:Math.sin(a)*165,t:3,r:4,s:'small',dmg:10});}burst(q.x,q.y,'#69db7c',8,120);sfx('zap');}}
    if(S.arena){const a=S.arena;if(Math.abs(q.x-a.x)>a.w||Math.abs(q.y-a.y)>a.h)q.t=0;}
    if(q.t>0&&(q.x-p.x)**2+(q.y-p.y)**2<(p.r+(q.r||4))**2&&p.iv<=0&&!S.demo&&S.endT<0){q.t=0;hitPlayer(q.dmg||12);}}
  S.eb=S.eb.filter(q=>q.t>0).concat(nb);
  for(const h of S.haz){h.t+=dt;
    if(!h.fired&&h.t>=h.warn){h.fired=true;if(h.fire)h.fire(h);if(h.k==='circ'&&h.dmg&&inHaz(h))hitPlayer(h.dmg);}
    if(h.k==='pool'&&h.fired&&inHaz(h))hitPlayer(h.dmg);}
  S.haz=S.haz.filter(h=>h.t<h.warn+(h.life||.15));

  if(S.endT<0)updWeapons(dt);
  updProj(dt);
  S.en=S.en.filter(e=>!e.dead);

  const mg=p.magnet;
  for(const g of S.gems){
    const dx2=p.x-g.x,dy2=p.y-g.y,d=Math.hypot(dx2,dy2)||1;
    if(!g.mag&&d<mg)g.mag=true;
    if(g.mag){g.sp=Math.min(g.sp+900*dt,700);g.x+=dx2/d*g.sp*dt;g.y+=dy2/d*g.sp*dt;}
    if(d<22){g.dead=true;gainXp(g.v);sfx('gem');}
  }
  S.gems=S.gems.filter(g=>!g.dead);
  if(S.gems.length>360){const old=S.gems.splice(0,60);gainXp(old.reduce((s,g)=>s+g.v,0));}
  for(const it of S.items){it.t+=dt;
    if((it.x-p.x)**2+(it.y-p.y)**2<30*30){it.dead=true;
      if(it.k==='candy'){p.hp=Math.min(p.maxHp,p.hp+30);toast('사탕! 체력 +30');sfx('pick');}
      else if(it.k==='meat'){p.hp=Math.min(p.maxHp,p.hp+p.maxHp*.5);toast('고기! 체력 50% 회복');sfx('pick');}
      else if(it.k==='magnet'){S.gems.forEach(g=>g.mag=true);toast('자석! 경험치를 모두 끌어와요');sfx('pick');}
      else if(it.k==='chest'&&!S.demo)S.chestPending=true;}}
  S.items=S.items.filter(i=>!i.dead);

  for(const q of S.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.9;q.vy*=.9;q.t-=dt;}
  S.parts=S.parts.filter(q=>q.t>0);
  for(const n of S.nums){n.y-=40*dt;n.t-=dt;}
  S.nums=S.nums.filter(n=>n.t>0);
  for(const f of S.fx)f.t-=dt;
  S.fx=S.fx.filter(f=>f.t>0);
  S.shake=Math.max(0,S.shake-dt*1.6);

  if(S.endT>=0){S.endT-=dt;if(S.endT<0)endGame(S.win);return;}
  if(S.demo){while(S.pendingLv>0){S.pendingLv--;const c=choices(1);if(c[0])applyUp(c[0]);}return;}
  if(S.chestPending){S.chestPending=false;openQuiz('chest');return;}
  if(S.traitPending){S.traitPending=false;openTraits();return;}
  if(S.bonusPending){S.bonusPending=false;openQuiz('bonus');return;}
  if(S.pendingLv>0){S.pendingLv--;openQuiz('level');}
}

function pline(x0,y0,x1,y1,w,col){
  b.fillStyle=col;x0|=0;y0|=0;x1|=0;y1|=0;let dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,er=dx+dy;
  for(let n=0;n<600;n++){b.fillRect(x0-(w>>1),y0-(w>>1),w,w);if(x0===x1&&y0===y1)break;const e2=2*er;if(e2>=dy){er+=dy;x0+=sx;}if(e2<=dx){er+=dx;y0+=sy;}}
}
function drawNum(v,x,y,col){const s=String(v),w=s.length*4-1;for(let i=0;i<s.length;i++)b.drawImage(DIG[col][+s[i]],x-(w>>1)+i*4-1,y-1);}

function answer(i){
  const Q=S.quiz;if(!Q||Q.done)return;Q.done=true;
  const q=Q.q,ok=q.opts[i]===q.a;S.qTotal++;S.log.push({gi:q.gi,ok});
  [...$('#qOpts').children].forEach((x,k)=>{x.disabled=true;if(q.opts[k]===q.a)x.classList.add('right');else if(k===i)x.classList.add('wrong');else x.classList.add('fade');});
  if(ok){S.qRight++;S.streak++;sfx('right');if(S.p.quizHeal)S.p.hp=Math.min(S.p.maxHp,S.p.hp+S.p.quizHeal);$('#qFeed').innerHTML=`<div class="stamp">참 잘했어요!</div>`;setTimeout(()=>afterQuiz(true),700);}
  else{S.streak=0;sfx('wrong');S.wrongs.push(q);
    $('#qFeed').innerHTML=`<div class="badbox"><h3>아쉬워요!</h3><div class="ans">정답은 ${fmt(q.a)}</div><div class="ex">풀이: ${fmt(q.e)}</div></div>

}
function afterQuiz(ok){
  const Q=S.quiz;if(!Q||Q.after)return;Q.after=true;
  if(Q.kind==='bonus'){
    if(ok){const p=S.p,k=p.hp<p.maxHp*.5?'meat':(Math.random()<.5?'meat':'magnet'),a=Math.random()*TAU;
      S.items.push({k,x:p.x+Math.cos(a)*70,y:p.y+Math.sin(a)*70,t:0});toast(k==='meat'?'근처에 고기가 떨어졌어요!':'근처에 자석이 떨어졌어요!');}
    resume();return;}
  if(Q.kind==='level'){
    if(ok){const bonus=S.streak>0&&S.streak%3===0;if(bonus)S.p.hp=Math.min(S.p.maxHp,S.p.hp+20);openUp(bonus?4:3,bonus);}
    else{const c=choices(1)[0];applyUp(c);toast('랜덤 스킬: '+upName(c));resume();}
  }else{
    if(ok){const got=[];const ev=upPool().find(u=>u.t==='evo');
      if(ev){applyUp(ev);got.push(upName(ev));}else for(let i=0;i<2;i++){const c=choices(1)[0];if(c){applyUp(c);got.push(upName(c));}}

    else{S.p.hp=Math.min(S.p.maxHp,S.p.hp+30);toast('체력 +30');}
    resume();
  }
}

function fmtTime(s){s=Math.floor(s);return`${s/60|0}분 ${String(s%60).padStart(2,'0')}초`;}
function topicStats(){
  const m=new Map();for(const l of S.log){if(l.gi==null)continue;const o=m.get(l.gi)||{n:0,ok:0};o.n++;if(l.ok)o.ok++;m.set(l.gi,o);}
  return [...m.entries()].map(([gi,o])=>({name:TOPICS[S.grade-1][gi]||'기타',n:o.n,ok:o.ok,acc:Math.round(o.ok/o.n*100)}));
}
function reportText(){
  const ts=topicStats(),acc=S.qTotal?Math.round(S.qRight/S.qTotal*100):0,nm=($('#stuName')&&$('#stuName').value.trim())||'';
  const strong=ts.filter(t=>t.acc>=80&&t.n>=2).sort((a,b)=>b.acc-a.acc).slice(0,2),weak=ts.filter(t=>t.acc<60).sort((a,b)=>a.acc-b.acc).slice(0,2);
  return [`[수학 히어로 결과]${nm?' '+nm:''}`,`${S.grade}학년 · ${S.win?'클리어':'생존 '+fmtTime(S.t)} · 레벨 ${S.p.lv} · 처치 ${S.kills}`,
    `문제 ${S.qTotal}개 · 정답 ${S.qRight}개 · 정답률 ${acc}% · 오답률 ${S.qTotal?100-acc:0}%`,
    ...ts.map(t=>`- ${t.name}: ${t.ok}/${t.n} (${t.acc}%)`),
    strong.length?`잘하는 단원: ${strong.map(t=>t.name).join(', ')}`:'',weak.length?`더 연습할 단원: ${weak.map(t=>t.name).join(', ')}`:''].filter(Boolean).join('\n');
}
function buildReport(){
  const ts=topicStats();
  if(!ts.length)return '<h3>📊 선생님 리포트</h3><p class="e" style="font-size:12px">이번 판에는 푼 문제가 없어요.</p>';
  const strong=ts.filter(t=>t.acc>=80&&t.n>=2).sort((a,b)=>b.acc-a.acc).slice(0,2),weak=ts.filter(t=>t.acc<60).sort((a,b)=>a.acc-b.acc).slice(0,2);
  const col=a=>a>=80?'#51cf66':a>=50?'#fcc419':'#ff6b6b';
  let fb='';
  if(strong.length)fb+=`<div>💪 잘하는 단원: <b>${strong.map(t=>`${t.name} (${t.acc}%)`).join(', ')}</b></div>`;
  if(weak.length)fb+=`<div>📌 더 연습할 단원: <b>${weak.map(t=>`${t.name} (${t.acc}%)`).join(', ')}</b></div>`;
  if(!fb)fb='<div>👍 모든 단원을 고르게 잘 풀고 있어요! 문제를 더 풀면 더 정확하게 알려줄게요.</div>';
  return `<h3>📊 선생님 리포트 · 단원별 정답률</h3>
    <div class="rep">${ts.map(t=>`<div class="rr"><span class="rnm">${t.name}</span><div class="rbar"><i style="width:${Math.max(4,t.acc)}%;background:${col(t.acc)}"></i></div><span class="rv">${t.ok}/${t.n}</span></div>`).join('')}</div>
    <div class="rfb">${fb}</div>
    <div class="rcopy"><input id="stuName" maxlength="12" placeholder="이름 (선택)"><button class="cbtn2 green" id="copyRep">📋 결과 복사</button></div>
    <textarea id="repTxt" readonly hidden></textarea>`;
}
